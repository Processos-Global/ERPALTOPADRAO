<style>
:root{

.fin-row-danger td{background:#FFFAFA}.fin-row-danger:hover td{background:#FEF2F2!important}.fin-danger-text{color:var(--fin-danger)}

.fin-summary-list{display:grid}.fin-summary-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--fin-line-soft);font-size:11px}.fin-summary-row:last-child{border-bottom:0}.fin-summary-row span{color:var(--fin-muted)}.fin-summary-row strong{text-align:right;color:#24374E}.fin-summary-total{display:flex;justify-content:space-between;align-items:end;padding-top:12px;margin-top:5px;border-top:1px solid var(--fin-line)}.fin-summary-total span{font-size:10px;color:var(--fin-muted);font-weight:700}.fin-summary-total strong{font-size:23px;color:var(--fin-ink);letter-spacing:-.03em}

.fin-data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid var(--fin-line);border-radius:7px;background:var(--fin-line);overflow:hidden}.fin-data{padding:11px 12px;background:#fff}.fin-data span{display:block;color:var(--fin-muted);font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:720}.fin-data strong{display:block;margin-top:4px;color:#24374E;font-size:11px;overflow-wrap:anywhere}.fin-note{margin-top:12px;padding:10px 12px;border:1px solid #D5E4E8;border-radius:7px;background:#F6FBFB;color:#516A72;font-size:10px;line-height:1.5}.fin-note--warn{border-color:#FED7AA;background:var(--fin-warn-bg);color:var(--fin-warn)}
.fin-timeline{display:grid;gap:0}.fin-timeline__item{position:relative;padding:2px 0 14px 18px;border-left:2px solid #D9E3E8}.fin-timeline__item:before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--fin-primary)}.fin-timeline__item:last-child{padding-bottom:2px}.fin-timeline__item strong{display:block;font-size:11px;color:#334155}.fin-timeline__item small{display:block;margin-top:3px;color:var(--fin-muted);font-size:9px}

@media(max-width:760px){.fin-page{padding:12px 9px 24px}.fin-head{align-items:flex-start;flex-direction:column;padding:17px 16px 17px 19px}.fin-head:after{display:none}.fin-title{font-size:25px}.fin-actions{justify-content:flex-start}.fin-toolbar,.fin-toolbar--compact,.fin-kpis,.fin-grid-equal,.fin-grid-3,.fin-form-grid,.fin-form-grid--3,.fin-context,.fin-data-grid,.fin-summary-strip{grid-template-columns:1fr}.fin-form-step{grid-template-columns:1fr}.fin-form-step__intro{border-right:0;border-bottom:1px solid var(--fin-line-soft);padding:15px}.fin-form-step__fields{padding:15px}.fin-form-footer{align-items:flex-start;flex-direction:column}.fin-form-footer__actions{width:100%;justify-content:flex-start}.fin-detail-head{grid-template-columns:1fr}.fin-detail-head__money{text-align:left}.fin-detail-actions{justify-content:flex-start}.fin-approval-bar{grid-template-columns:30px 1fr auto}.fin-approval-bar__fact,.fin-approval-bar__optional{display:none}.fin-inline-form{align-items:stretch}.fin-inline-form .fin-control{min-width:0;width:100%}}
</style>
