<style>
:root{
  --fin-bg:#f5f7fa;--fin-card:#fff;--fin-border:#e4e9ef;--fin-text:#16202a;--fin-muted:#697586;
  --fin-primary:#1f5eff;--fin-primary-soft:#edf3ff;--fin-success:#16834b;--fin-success-bg:#eaf8f0;
  --fin-warning:#9a6700;--fin-warning-bg:#fff7df;--fin-danger:#c23737;--fin-danger-bg:#fff0f0;
  --fin-radius:12px;--fin-shadow:0 1px 2px rgba(16,24,40,.04);
}
.fin-shell{max-width:1600px;margin:0 auto;padding:24px 28px 48px;color:var(--fin-text)}
.fin-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px}.fin-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fin-primary);margin-bottom:5px}.fin-title{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.03em}.fin-subtitle{margin:7px 0 0;color:var(--fin-muted);font-size:14px;max-width:760px}.fin-head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fin-subnav{display:flex;gap:6px;align-items:center;margin:0 0 22px;padding:6px;background:#eef1f5;border-radius:12px;overflow-x:auto}.fin-subnav a{white-space:nowrap;text-decoration:none;color:#4e5b6a;font-size:13px;font-weight:650;padding:9px 12px;border-radius:8px}.fin-subnav a:hover{background:#fff;color:var(--fin-text)}.fin-subnav a.is-active{background:#fff;color:var(--fin-primary);box-shadow:var(--fin-shadow)}
.fin-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 13px;border:1px solid var(--fin-border);border-radius:9px;background:#fff;color:#263241;text-decoration:none;font:600 13px/1 inherit;cursor:pointer}.fin-btn:hover{border-color:#c8d1dc;background:#fafbfc}.fin-btn--primary{background:var(--fin-primary);border-color:var(--fin-primary);color:#fff}.fin-btn--danger{color:var(--fin-danger);border-color:#f0caca}.fin-btn--ghost{background:transparent}.fin-btn--sm{min-height:32px;padding:6px 10px;font-size:12px}.fin-btn--block{width:100%}

.fin-card{background:var(--fin-card);border:1px solid var(--fin-border);border-radius:var(--fin-radius);box-shadow:var(--fin-shadow);overflow:hidden}.fin-card+.fin-card{margin-top:16px}.fin-card__head{padding:15px 17px;border-bottom:1px solid var(--fin-border);display:flex;align-items:center;justify-content:space-between;gap:16px}.fin-card__head h2,.fin-card__head h3{font-size:15px;margin:0;letter-spacing:-.01em}.fin-card__head p{font-size:12px;color:var(--fin-muted);margin:3px 0 0}.fin-card__body{padding:17px}.fin-card__body--flush{padding:0}
.fin-grid-2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:16px}.fin-grid-equal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.fin-sticky{position:sticky;top:82px}
.fin-toolbar{background:#fff;border:1px solid var(--fin-border);border-radius:var(--fin-radius);padding:12px;margin-bottom:14px}.fin-toolbar__row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fin-search{position:relative;flex:1 1 340px}.fin-search input{width:100%;padding-left:36px}.fin-search:before{content:'⌕';position:absolute;left:12px;top:8px;color:#8a96a6;font-size:18px}.fin-filter{min-width:145px}
.fin-control,select.fin-control,input.fin-control,textarea.fin-control{width:100%;min-height:40px;border:1px solid #d6dde6;border-radius:8px;background:#fff;color:var(--fin-text);font:500 13px/1.4 inherit;padding:9px 11px;outline:none;transition:.15s}.fin-control:focus{border-color:#8fb0ff;box-shadow:0 0 0 3px rgba(31,94,255,.09)}textarea.fin-control{resize:vertical}.fin-control:disabled{background:#f4f6f8;color:#697586;cursor:not-allowed}.fin-check{width:18px;height:18px}
.fin-form-section{padding:18px 0;border-top:1px solid var(--fin-border)}.fin-form-section:first-child{border-top:0;padding-top:0}.fin-form-section__head{margin-bottom:14px}.fin-form-section__head h3{font-size:14px;margin:0}.fin-form-section__head p{font-size:12px;color:var(--fin-muted);margin:4px 0 0}.fin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px}.fin-form-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}.fin-field--full{grid-column:1/-1}.fin-field label{display:block;font-size:12px;font-weight:650;color:#465465;margin-bottom:6px}.fin-help{display:block;font-size:11px;color:var(--fin-muted);margin-top:5px}.fin-error{display:block;font-size:11px;color:var(--fin-danger);margin-top:5px}.fin-form-errors{padding:10px 12px;background:var(--fin-danger-bg);color:var(--fin-danger);border-radius:8px;margin-bottom:14px;font-size:12px}
.fin-readonly{padding:9px 0}.fin-readonly__label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fin-muted);font-weight:700}.fin-readonly__value{font-size:14px;font-weight:650;margin-top:3px}.fin-readonly__meta{font-size:11px;color:var(--fin-muted);margin-top:3px}
.fin-table-wrap{overflow:auto}.fin-table{width:100%;border-collapse:collapse;min-width:900px}.fin-table th{position:sticky;top:0;background:#f8fafc;color:#667385;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.045em;font-weight:750;padding:10px 12px;border-bottom:1px solid var(--fin-border)}.fin-table td{padding:11px 12px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:middle}.fin-table tr:last-child td{border-bottom:0}.fin-table tbody tr:hover{background:#fbfcfe}.fin-money{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}.fin-date{white-space:nowrap;font-variant-numeric:tabular-nums}.fin-main-cell strong{display:block;font-size:13px}.fin-main-cell small{display:block;color:var(--fin-muted);margin-top:3px;font-size:11px}.fin-table-link{text-decoration:none;color:inherit}.fin-table-link:hover strong{color:var(--fin-primary)}
.fin-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:10.5px;font-weight:750;white-space:nowrap;background:#f1f3f5;color:#576474}.fin-badge--success{background:var(--fin-success-bg);color:var(--fin-success)}.fin-badge--warning{background:var(--fin-warning-bg);color:var(--fin-warning)}.fin-badge--danger{background:var(--fin-danger-bg);color:var(--fin-danger)}.fin-badge--neutral{background:#f1f3f5;color:#576474}
.fin-empty{text-align:center;padding:42px 20px;color:var(--fin-muted)}.fin-empty strong{display:block;color:var(--fin-text);margin-bottom:5px}.fin-pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--fin-border);font-size:12px;color:var(--fin-muted)}
.fin-summary-list{display:grid;gap:0}.fin-summary-row{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:13px}.fin-summary-row:last-child{border-bottom:0}.fin-summary-row span{color:var(--fin-muted)}.fin-summary-row strong{text-align:right}.fin-summary-total{display:flex;justify-content:space-between;align-items:end;padding-top:14px;margin-top:4px;border-top:1px solid var(--fin-border)}.fin-summary-total span{font-size:12px;color:var(--fin-muted);font-weight:650}.fin-summary-total strong{font-size:23px;letter-spacing:-.02em}
.fin-detail-hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;background:#fff;border:1px solid var(--fin-border);border-radius:var(--fin-radius);padding:18px 20px;margin-bottom:16px}.fin-detail-hero__id{font-size:12px;color:var(--fin-muted);font-weight:700}.fin-detail-hero h1{font-size:21px;margin:4px 0 2px}.fin-detail-hero__doc{font-size:13px;color:var(--fin-muted)}.fin-detail-hero__amount{text-align:right}.fin-detail-hero__amount strong{display:block;font-size:29px;letter-spacing:-.035em}.fin-detail-hero__amount small{color:var(--fin-muted)}
.fin-tabs{display:flex;gap:18px;border-bottom:1px solid var(--fin-border);margin-bottom:17px}.fin-tabs a{padding:10px 1px;text-decoration:none;color:var(--fin-muted);font-size:13px;font-weight:650;border-bottom:2px solid transparent}.fin-tabs a.is-active{color:var(--fin-primary);border-color:var(--fin-primary)}
.fin-checklist{display:grid;gap:8px}.fin-checkrow{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;background:#f8fafb;border-radius:8px;font-size:12px}.fin-checkrow strong{display:block}.fin-checkrow small{color:var(--fin-muted)}.fin-checkdot{width:18px;height:18px;border-radius:50%;background:var(--fin-success-bg);color:var(--fin-success);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}.fin-checkrow--danger{background:var(--fin-danger-bg)}.fin-checkrow--danger .fin-checkdot{background:#ffe0e0;color:var(--fin-danger)}
.fin-chart{height:270px;position:relative}.fin-chart canvas{width:100%;height:100%;display:block}.fin-chart-legend{display:flex;gap:15px;align-items:center;font-size:11px;color:var(--fin-muted)}.fin-chart-legend span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fin-primary);margin-right:5px}.fin-chart-caption{font-size:11px;color:var(--fin-muted);margin-top:8px}
.fin-approval{padding:16px;border:1px solid var(--fin-border);border-radius:11px;background:#fff}.fin-approval+.fin-approval{margin-top:10px}.fin-approval__top{display:flex;justify-content:space-between;gap:20px}.fin-approval__title{font-size:14px;font-weight:750}.fin-approval__meta{font-size:11px;color:var(--fin-muted);margin-top:4px}.fin-approval__amount{text-align:right;font-size:18px;font-weight:760}.fin-approval__facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}.fin-approval__fact{padding:9px 10px;background:#f7f9fb;border-radius:8px}.fin-approval__fact span{display:block;font-size:10px;color:var(--fin-muted);text-transform:uppercase;letter-spacing:.04em}.fin-approval__fact strong{display:block;font-size:12px;margin-top:3px}.fin-approval__actions{display:flex;justify-content:flex-end;gap:7px;align-items:center}.fin-inline-form{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.fin-inline-form .fin-control{width:auto;min-width:180px}
.fin-settings-grid{display:grid;grid-template-columns:minmax(360px,.8fr) minmax(0,1.4fr);gap:16px}.fin-danger-box{background:var(--fin-danger-bg);border:1px solid #f0cece;border-radius:10px;padding:12px;color:#8e2929;font-size:12px}
.fin-mobile-label{display:none}
@media(max-width:1100px){.fin-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fin-grid-2,.fin-settings-grid{grid-template-columns:1fr}.fin-sticky{position:static}.fin-form-grid--3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.fin-shell{padding:18px 14px 36px}.fin-page-head,.fin-detail-hero{flex-direction:column}.fin-detail-hero__amount{text-align:left}.fin-kpis{grid-template-columns:1fr}.fin-form-grid,.fin-form-grid--3{grid-template-columns:1fr}.fin-field--full{grid-column:auto}.fin-approval__facts{grid-template-columns:1fr}.fin-title{font-size:24px}}
</style>
