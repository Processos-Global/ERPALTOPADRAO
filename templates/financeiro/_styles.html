<style>
:root{
  --fin-ink:var(--saari-text);
  --fin-text:var(--saari-text);
  --fin-muted:var(--saari-text-muted);
  --fin-line:var(--saari-border);
  --fin-line-soft:color-mix(in srgb,var(--saari-border) 60%,var(--saari-surface));
  --fin-bg:var(--saari-bg);
  --fin-card:var(--saari-surface);
  --fin-primary:var(--saari-accent);
  --fin-primary-dark:var(--saari-text);
  --fin-primary-deep:var(--saari-text);
  --fin-primary-soft:var(--saari-hover);
  --fin-primary-border:var(--saari-border);
  --fin-ok:var(--saari-success);
  --fin-ok-bg:color-mix(in srgb,var(--saari-success) 12%,var(--saari-surface));
  --fin-warn:var(--saari-warning);
  --fin-warn-bg:color-mix(in srgb,var(--saari-warning) 12%,var(--saari-surface));
  --fin-danger:var(--saari-danger);
  --fin-danger-bg:color-mix(in srgb,var(--saari-danger) 12%,var(--saari-surface));
  --fin-info:var(--saari-info);
  --fin-info-bg:color-mix(in srgb,var(--saari-info) 12%,var(--saari-surface));
  --fin-shadow:0 2px 5px color-mix(in srgb,var(--saari-shadow-color) 30%,transparent);
  --fin-shadow-hover:0 6px 18px var(--saari-shadow-color);
}

body>.app-shell>.app-content>.page-content{
  max-width:none!important;
  margin:0!important;
  padding:0!important;
  min-height:100vh!important;
  background:var(--fin-bg)!important;
}

.fin-page,.fin-page *{box-sizing:border-box}
.fin-page{
  width:100%;
  max-width:1540px;
  margin:0 auto;
  padding:28px 30px 46px;
  color:var(--fin-text);
  font-family:inherit;
  font-size:15px;
  line-height:1.55;
}

/* Cabeçalho — segue a linguagem visual do painel principal */
.fin-head{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  overflow:hidden;
  margin-bottom:18px;
  padding:16px 20px;
  border:1px solid var(--fin-line);
  border-radius:var(--saari-radius);
  background:var(--fin-card);
  box-shadow:var(--fin-shadow);
}
.fin-head__copy,.fin-actions{position:relative;z-index:1}
.fin-head__copy{min-width:0}
.fin-eyebrow{
  margin-bottom:5px;
  color:var(--fin-primary);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.fin-title{
  margin:0;
  color:var(--fin-primary-deep);
  font-size:clamp(1.5rem,2.35vw,2rem);
  font-weight:850;
  line-height:1.04;
  letter-spacing:-.035em;
}
.fin-sub{
  max-width:900px;
  margin-top:8px;
  color:var(--fin-muted);
  font-size:14px;
  line-height:1.55;
}
.fin-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  flex-wrap:wrap;
  flex:0 0 auto;
}

/* Navegação interna */
.fin-module-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fin-subnav{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin:0;
  padding:6px;
  min-width:0;
  border:1px solid var(--saari-line);
  border-radius:10px;
  background:var(--saari-surface);
}
.fin-subnav a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 14px;
  border-radius:10px;
  color:var(--saari-muted);
  text-decoration:none;
  white-space:nowrap;
  font-size:13px;
  font-weight:750;
  transition:.16s ease;
}
.fin-subnav a:hover{background:var(--saari-surface-soft);color:var(--saari-text)}
.fin-subnav a.is-active{
  background:var(--saari-surface-soft);
  color:var(--saari-text);
  box-shadow:inset 0 -2px 0 var(--saari-accent);
}
.fin-config{position:relative}
.fin-config__links{position:absolute;z-index:5;inset-inline-end:0;min-width:12rem;padding:5px;border:1px solid var(--saari-line);border-radius:8px;background:var(--saari-surface)}
.fin-config__links a{display:block;padding:8px 10px;color:var(--saari-text);text-decoration:none}
.fin-config__links a:hover,.fin-config__links a:focus-visible{background:var(--saari-surface-soft)}
.fin-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fin-tabs [aria-current="page"]{border-color:var(--saari-accent);background:var(--saari-surface-soft)}
.fin-filter-more{min-width:0;color:var(--saari-text)}
.fin-filter-more summary{cursor:pointer}
.fin-filter-more__campos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fin-filter-more__campos>*{flex:1 1 155px;min-width:0;max-width:100%}
.fin-desembolsos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.fin-desembolsos div{display:grid;gap:4px}
.fin-desembolsos meter{width:100%;height:14px;accent-color:var(--saari-accent)}

/* Botões */
.fin-btn{
  appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:40px;
  padding:8px 14px;
  border:1px solid #eee8d6;
  border-radius:10px;
  background:var(--saari-surface);
  color:var(--saari-text);
  text-decoration:none;
  font:inherit;
  font-size:13px;
  font-weight:750;
  line-height:1.2;
  cursor:pointer;
  transition:.16s ease;
}
.fin-btn:hover{
  border-color:var(--saari-border);
  color:var(--fin-primary-dark);
  box-shadow:0 6px 16px rgba(119,101,92,.10);
  transform:translateY(-1px);
}
.fin-btn:active{transform:translateY(0)}
.fin-btn--primary{border-color:var(--saari-primary);background:var(--saari-primary);color:var(--saari-on-primary)}
.fin-btn--primary:hover{border-color:var(--saari-primary-hover);background:var(--saari-primary-hover);color:var(--saari-on-primary)}
.fin-btn--danger{border-color:var(--fin-danger);background:var(--saari-surface);color:var(--fin-danger)}
.fin-btn--danger:hover{border-color:var(--fin-danger);background:var(--fin-danger-bg);color:var(--fin-danger)}
.fin-btn--soft{border-color:var(--fin-primary-border);background:var(--fin-primary-soft);color:var(--fin-primary-dark)}
.fin-btn--sm{min-height:34px;padding:6px 10px;font-size:12px}
.fin-btn--block{width:100%}
.fin-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}

/* KPIs */
.fin-kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
  margin-bottom:20px;
}
.fin-kpi{
  position:relative;
  display:block;
  min-width:0;
  overflow:hidden;
  padding:18px 18px 17px;
  border:1px solid var(--fin-line);
  border-radius:15px;
  background:var(--saari-surface);
  color:inherit;
  text-decoration:none;
  box-shadow:var(--fin-shadow);
  transition:.17s ease;
}
.fin-kpi::after{
  content:"";
  position:absolute;
  right:-35px;
  top:-48px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:rgba(119,101,92,.045);
}
a.fin-kpi:hover{border-color:var(--saari-border);box-shadow:var(--fin-shadow-hover);transform:translateY(-2px)}
.fin-kpi span,.fin-kpi__label{display:block;color:var(--fin-muted);font-size:12px;font-weight:720}
.fin-kpi strong,.fin-kpi__value{
  position:relative;
  z-index:1;
  display:block;
  margin-top:5px;
  overflow:hidden;
  color:var(--fin-primary-deep);
  font-size:26px;
  font-weight:850;
  letter-spacing:-.03em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.fin-kpi small,.fin-kpi__meta{display:block;margin-top:5px;color:var(--saari-text-muted);font-size:11px}
.fin-kpi--danger{border-left:4px solid #d87a7a}.fin-kpi--danger strong,.fin-kpi--danger .fin-kpi__value{color:var(--fin-danger)}
.fin-kpi--warning{border-left:4px solid #ddb257}.fin-kpi--warning strong,.fin-kpi--warning .fin-kpi__value{color:var(--fin-warn)}
.fin-kpi--success{border-left:4px solid #b9aa72}.fin-kpi--success strong,.fin-kpi--success .fin-kpi__value{color:var(--fin-ok)}

/* Seções */
.fin-section{
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid var(--fin-line);
  border-radius:15px;
  background:var(--saari-surface);
  box-shadow:var(--fin-shadow);
}
.fin-section__head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:60px;
  padding:15px 18px;
  border-bottom:1px solid var(--fin-line-soft);
  background:linear-gradient(180deg,#fff,#fcf9f3);
}
.fin-section__head h2,.fin-section__head h3{margin:0;color:var(--fin-primary-deep);font-size:16px;font-weight:820}
.fin-section__head p{margin:4px 0 0;color:var(--fin-muted);font-size:12px;line-height:1.45}
.fin-section__body{padding:18px}
.fin-section__body--flush{padding:0}

/* Filtros */
.fin-toolbar{
  display:grid;
  grid-template-columns:minmax(220px,1.6fr) repeat(5,minmax(135px,1fr)) auto;
  gap:11px;
  align-items:end;
  margin-bottom:20px;
  padding:15px;
  border:1px solid var(--fin-line);
  border-radius:14px;
  background:var(--saari-surface);
  box-shadow:var(--fin-shadow);
}
.fin-toolbar--compact{grid-template-columns:repeat(3,minmax(180px,1fr)) auto}
.fin-toolbar__actions{display:flex;gap:8px;align-items:end;justify-content:flex-end}
.fin-filter-field{min-width:0}
.fin-filter-field label{
  display:block;
  margin:0 0 6px;
  color:var(--saari-text-muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.045em;
}

/* Campos */
.fin-control,select.fin-control,input.fin-control,textarea.fin-control{
  width:100%;
  min-height:42px;
  padding:9px 11px;
  border:1px solid #eee8d6;
  border-radius:9px;
  background:var(--saari-surface);
  color:var(--saari-text);
  font:inherit;
  font-size:13px;
  outline:none;
  transition:.16s ease;
}
.fin-control:hover{border-color:var(--saari-border)}
.fin-control:focus{border-color:#b9aa72;box-shadow:0 0 0 3px rgba(119,101,92,.10)}
textarea.fin-control{min-height:96px;resize:vertical}
select.fin-control[multiple]{min-height:160px}
.fin-control:disabled,.fin-control--locked{background:var(--saari-hover);color:var(--saari-text-muted);cursor:not-allowed}
.fin-control::placeholder{color:var(--saari-text-muted)}
.fin-check{width:18px;height:18px;accent-color:var(--fin-primary);cursor:pointer}
input[type=file].fin-control{padding:7px 9px}

/* Formulários */
.fin-form{
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid var(--fin-line);
  border-radius:15px;
  background:var(--saari-surface);
  box-shadow:var(--fin-shadow);
}
.fin-form-step{display:grid;grid-template-columns:205px minmax(0,1fr);border-top:1px solid var(--fin-line-soft)}
.fin-form-step:first-child{border-top:0}
.fin-form-step__intro{padding:21px 20px;background:var(--saari-hover);border-right:1px solid var(--fin-line-soft)}
.fin-step-number{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  margin-bottom:10px;
  border-radius:9px;
  background:var(--fin-primary-soft);
  color:var(--fin-primary-dark);
  font-size:12px;
  font-weight:850;
}
.fin-form-step__intro h3{margin:0 0 5px;color:var(--fin-primary-deep);font-size:14px;font-weight:820}
.fin-form-step__intro p{margin:0;color:var(--fin-muted);font-size:12px;line-height:1.5}
.fin-form-step__fields{padding:20px}
.fin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 17px}
.fin-form-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fin-field{min-width:0}.fin-field--full{grid-column:1/-1}
.fin-field label{display:block;margin:0 0 6px;color:var(--saari-text);font-size:12px;font-weight:760}
.fin-required{color:var(--fin-danger)}
.fin-help{display:block;margin-top:5px;color:var(--saari-text-muted);font-size:11px;line-height:1.45}
.fin-error{display:block;margin-top:5px;color:var(--fin-danger);font-size:11px;font-weight:700}
.fin-form-errors{margin:14px 18px;padding:12px 14px;border:1px solid #efc4c4;border-radius:10px;background:var(--fin-danger-bg);color:var(--fin-danger);font-size:12px}
.fin-form-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-top:1px solid var(--fin-line);background:var(--saari-hover)}
.fin-form-footer__hint{color:var(--fin-muted);font-size:11px}
.fin-form-footer__actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fin-form details{border:1px solid var(--fin-line-soft);border-radius:10px;background:var(--saari-hover)}
.fin-form details>summary{padding:12px 14px!important;list-style:none;color:var(--saari-text);font-size:12px;font-weight:800!important;cursor:pointer}
.fin-form details>summary::-webkit-details-marker{display:none}
.fin-form details>summary:after{content:"+";float:right;color:var(--fin-primary);font-size:16px;line-height:1}
.fin-form details[open]>summary:after{content:"−"}
.fin-form details[open]>.fin-form-grid{padding:0 14px 14px;margin-top:0!important}

/* Contexto */
.fin-context{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
  gap:0;
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid var(--fin-line);
  border-radius:14px;
  background:var(--saari-surface);
  box-shadow:var(--fin-shadow);
}
.fin-context__item{min-width:0;padding:13px 14px;border-right:1px solid var(--fin-line-soft);border-bottom:1px solid var(--fin-line-soft);background:var(--saari-surface)}
.fin-context__label{display:block;color:var(--fin-muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.055em}
.fin-context__value{display:block;margin-top:4px;color:var(--saari-text);font-size:13px;font-weight:760;line-height:1.4;overflow-wrap:anywhere}
.fin-context__item--accent{background:var(--saari-surface)}
.fin-context__item--accent .fin-context__value{color:var(--fin-primary-dark);font-size:15px;font-weight:830}

/* Tabelas */
.fin-table-wrap{width:100%;min-width:0;overflow:auto;overscroll-behavior-inline:contain;scrollbar-width:thin}
.fin-table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:13px}
.fin-table th{
  padding:11px 13px;
  border-bottom:1px solid var(--fin-line);
  background:var(--saari-surface);
  color:var(--saari-text-muted);
  text-align:left;
  font-size:11px;
  font-weight:820;
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
}
.fin-table td{padding:12px 13px;border-bottom:1px solid var(--fin-line-soft);vertical-align:middle;color:var(--saari-text);line-height:1.4}
.fin-table tbody tr{transition:background .12s}
.fin-table tbody tr:hover{background:#f8fbfc}
.fin-table tr:last-child td{border-bottom:0}
.fin-main-cell{min-width:185px}
.fin-main-cell strong{display:block;color:var(--saari-text);font-size:13px;font-weight:790}
.fin-main-cell small{display:block;margin-top:3px;color:var(--fin-muted);font-size:11px;line-height:1.4}
.fin-table-link{color:inherit;text-decoration:none}
.fin-table-link:hover strong{color:var(--fin-primary-dark)}
.fin-table a:not(.fin-btn){color:var(--fin-primary-dark);text-decoration:none;font-weight:730}
.fin-table a:not(.fin-btn):hover{text-decoration:underline}
.fin-money{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:820;color:var(--saari-text)!important}
.fin-date{white-space:nowrap;font-variant-numeric:tabular-nums}
.fin-muted{color:var(--fin-muted)}
.fin-badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  background:var(--saari-hover);
  color:var(--saari-text-muted);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.fin-badge--success{background:var(--fin-ok-bg);color:var(--fin-ok)}
.fin-badge--warning{background:var(--fin-warn-bg);color:var(--fin-warn)}
.fin-badge--danger{background:var(--fin-danger-bg);color:var(--fin-danger)}
.fin-badge--neutral{background:var(--saari-hover);color:var(--saari-text-muted)}
.fin-badge--info{background:var(--fin-info-bg);color:var(--fin-info)}
.fin-row-danger td{background:var(--fin-danger-bg)}.fin-row-danger:hover td{background:color-mix(in srgb,var(--saari-danger) 18%,var(--fin-card))}.fin-danger-text{color:var(--fin-danger)}
.fin-empty{padding:34px 18px!important;text-align:center;color:var(--saari-text-muted)!important;font-size:12px}
.fin-empty strong{display:block;margin-bottom:4px;color:var(--saari-text);font-size:13px}
.fin-pagination{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--fin-line);background:var(--saari-hover);font-size:11px;color:var(--fin-muted)}

/* Layouts */
.fin-grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.72fr);gap:18px;align-items:start}
.fin-grid-equal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.fin-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.fin-settings-grid{display:grid;grid-template-columns:minmax(350px,.7fr) minmax(0,1.3fr);gap:18px;align-items:start}

/* Resumos */
.fin-summary-list{display:grid}
.fin-summary-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--fin-line-soft);font-size:12px}
.fin-summary-row:last-child{border-bottom:0}
.fin-summary-row span{min-width:0;color:var(--fin-muted)}
.fin-summary-row strong{flex:0 0 auto;text-align:right;color:var(--saari-text);font-weight:800}
.fin-summary-total{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:13px;margin-top:6px;border-top:1px solid var(--fin-line)}
.fin-summary-total span{font-size:12px;color:var(--fin-muted);font-weight:720}
.fin-summary-total strong{font-size:25px;color:var(--fin-primary-deep);font-weight:850;letter-spacing:-.025em}

/* Detalhes */
.fin-detail-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:20px;
  align-items:center;
  margin-bottom:14px;
  padding:20px 22px;
  border:1px solid var(--fin-line);
  border-radius:var(--saari-radius);
  background:var(--fin-card);
  box-shadow:var(--fin-shadow);
}
.fin-detail-head .saari-breadcrumbs{margin-bottom:6px}
.fin-detail-head h1{margin:4px 0;color:var(--fin-primary-deep);font-size:27px;font-weight:840;letter-spacing:-.025em}
.fin-detail-head p{margin:0;color:var(--fin-muted);font-size:13px}
.fin-detail-head__money{text-align:right}
.fin-detail-head__money strong{display:block;margin-bottom:6px;color:var(--fin-primary-deep);font-size:30px;font-weight:850;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.fin-detail-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fin-data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--fin-line);border-radius:11px;overflow:hidden}
.fin-data{min-width:0;padding:13px 14px;border-right:1px solid var(--fin-line-soft);border-bottom:1px solid var(--fin-line-soft);background:var(--saari-surface)}
.fin-data span{display:block;color:var(--fin-muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.fin-data strong{display:block;margin-top:4px;color:var(--saari-text);font-size:13px;font-weight:760;overflow-wrap:anywhere}
.fin-data small{display:block;margin-top:3px;font-size:11px}
.fin-note{margin-top:13px;padding:12px 14px;border:1px solid #eee8d6;border-radius:10px;background:var(--saari-surface);color:var(--saari-text);font-size:12px;line-height:1.55}
.fin-note--warn{border-color:#ead49f;background:var(--fin-warn-bg);color:#80530f}

/* Timeline */
.fin-timeline{display:grid}
.fin-timeline__item{position:relative;padding:1px 0 15px 18px;border-left:1px solid #eee8d6}
.fin-timeline__item:before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--fin-primary)}
.fin-timeline__item:last-child{padding-bottom:1px}
.fin-timeline__item strong{display:block;color:var(--saari-text);font-size:13px}
.fin-timeline__item small{display:block;margin-top:3px;color:var(--fin-muted);font-size:11px}

/* Combobox */
.fin-combobox{position:relative}
.fin-combobox__input{padding-right:38px!important}
.fin-combobox__toggle{position:absolute;right:7px;top:21px;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:15px;color:var(--saari-text-muted);padding:4px 6px}
.fin-combobox__menu{position:absolute;z-index:50;top:calc(100% + 5px);left:0;right:0;max-height:270px;overflow:auto;padding:5px;border:1px solid #eee8d6;border-radius:10px;background:var(--saari-surface);box-shadow:0 14px 30px rgba(45,32,28,.14)}
.fin-combobox__option{display:block;width:100%;padding:9px 10px;border:0;border-radius:7px;background:var(--saari-surface);color:var(--saari-text);text-align:left;font:inherit;font-size:12px;cursor:pointer}
.fin-combobox__option:hover,.fin-combobox__option.is-focus{background:#f5f0e5;color:var(--fin-primary-dark)}
.fin-combobox__option[hidden]{display:none}
.fin-combobox__empty{padding:10px;color:var(--saari-text-muted);font-size:11px}
.fin-combobox__chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.fin-combobox__chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid #eee8d6;border-radius:7px;background:#f7fafb;color:var(--saari-text);font-size:11px}
.fin-combobox__chip button{border:0;background:transparent;color:var(--saari-text-muted);font-size:14px;line-height:1;cursor:pointer;padding:0}
.fin-combobox.is-open .fin-combobox__toggle{transform:translateY(-50%) rotate(180deg)}
.fin-config-row{display:grid;grid-template-columns:minmax(205px,1fr) 132px auto;gap:8px;align-items:end;min-width:390px}
.fin-config-row .fin-control{min-height:38px;padding:7px 9px;font-size:12px}
.fin-config-row .fin-combobox__toggle{top:19px}

/* Faixas auxiliares */
.fin-summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:0;margin-bottom:18px;overflow:hidden;border:1px solid var(--fin-line);border-radius:14px;background:var(--saari-surface);box-shadow:var(--fin-shadow)}
.fin-summary-strip__item{padding:13px 14px;border-right:1px solid var(--fin-line-soft);border-bottom:1px solid var(--fin-line-soft)}
.fin-summary-strip__item span{display:block;color:var(--fin-muted);font-size:11px}
.fin-summary-strip__item strong{display:block;margin-top:3px;color:var(--saari-text);font-size:13px}
.fin-summary-strip__item--money strong{font-size:19px}
.fin-approval-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--fin-line);background:var(--saari-hover)}
.fin-inline-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fin-inline-form .fin-control{min-width:220px;min-height:38px;font-size:12px}

@media(max-width:1280px){
  .fin-toolbar{grid-template-columns:repeat(3,minmax(160px,1fr))}
  .fin-toolbar__actions{grid-column:1/-1;justify-content:flex-start}
  .fin-grid-2,.fin-settings-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .fin-page{padding:22px 16px 34px}
  .fin-head{align-items:flex-start;flex-direction:column;gap:14px;padding:14px 16px}
    .fin-actions{justify-content:flex-start}
  .fin-toolbar,.fin-toolbar--compact{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fin-form-step{grid-template-columns:1fr}
  .fin-form-step__intro{border-right:0;border-bottom:1px solid var(--fin-line-soft)}
  .fin-grid-equal,.fin-grid-3{grid-template-columns:1fr}
  .fin-data-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){
  .fin-page{padding:16px 10px 28px}
  .fin-title{font-size:1.5rem}
  .fin-sub{font-size:13px}
  .fin-toolbar,.fin-toolbar--compact,.fin-form-grid,.fin-form-grid--3,.fin-data-grid{grid-template-columns:1fr}
  .fin-toolbar__actions{grid-column:auto;justify-content:flex-start;flex-wrap:wrap}
  .fin-form-step__intro,.fin-form-step__fields{padding:16px}
  .fin-form-footer{align-items:flex-start;flex-direction:column}
  .fin-form-footer__actions{width:100%;justify-content:flex-start}
  .fin-detail-head{grid-template-columns:1fr}
  .fin-detail-head__money{text-align:left}
  .fin-detail-actions{justify-content:flex-start}
  .fin-table{min-width:700px}
}

.fin-page :is(.fin-btn,.fin-control,summary):focus-visible{outline:2px solid var(--saari-focus-ring);outline-offset:2px}
.fin-page .fin-control:read-only:not(select){border-color:var(--fin-line);color:var(--fin-muted);background:var(--saari-hover)}
.fin-page .fin-table .fin-money:not(:last-child){text-align:right}
.fin-table th[scope="col"]{font-size:.75rem}
@media(max-width:640px){.fin-page :is(.fin-btn,.fin-control){min-height:var(--saari-control-height)}}
</style>
