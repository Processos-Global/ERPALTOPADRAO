{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#453330" id="saari-auth-theme-color">
    <script>
        (function(){
            let theme='light';
            try {
                const saved=localStorage.getItem('saari-theme');
                if(saved==='light'||saved==='dark') theme=saved;
                else if(matchMedia('(prefers-color-scheme: dark)').matches) theme='dark';
            } catch(e) {}
            document.documentElement.dataset.theme=theme;
        })();
    </script>
    <title>{% block title %}Recuperar senha{% endblock %} | SAARI ERP</title>

    <link rel="icon" type="image/png" href="{% static 'img/saari/saari-simbolo-gold.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'img/saari/saari-simbolo-gold.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <style>
        :root {
            --opal-blue: #b9aa72;
            --opal-blue-dark: #453330;
            --opal-blue-deep: #2d201c;
            --opal-blue-soft: #eee8d6;
            --opal-blue-border: #ded7c8;
            --auth-bg: #f5f1e9;
            --auth-surface: #fffdfa;
            --auth-surface-soft: #faf7f1;
            --auth-text: #4b3a35;
            --auth-muted: #85776f;
            --auth-border: #ded7c8;
            --auth-danger: #9a463e;
            --auth-danger-soft: #FFF5F4;
            --auth-success: #453330;
            --auth-success-soft: #fffdfa;
            --auth-focus: rgba(185, 170, 114, .14);
        }

        html, body { min-height: 100%; }

        body.auth-body {
            margin: 0 !important;
            min-height: 100vh !important;
            color: var(--auth-text);
            background:
                linear-gradient(rgba(69, 51, 48, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(69, 51, 48, .025) 1px, transparent 1px),
                radial-gradient(circle at 12% 10%, rgba(185, 170, 114, .10), transparent 28%),
                radial-gradient(circle at 88% 88%, rgba(69, 51, 48, .06), transparent 30%),
                var(--auth-bg) !important;
            background-size: 32px 32px, 32px 32px, auto, auto, auto;
            font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
        }

        .auth-body * { box-sizing: border-box; }

        .auth-shell {
            min-height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            position: relative;
            width: min(100%, 470px);
            padding: 34px;
            background: rgba(255,253,250,.97);
            border: 1px solid rgba(222,215,200,.95);
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(69,51,48,.025), 0 18px 50px rgba(69,51,48,.08);
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--opal-blue-deep), var(--opal-blue));
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .auth-brand__mark {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--opal-blue-deep);
            color: #fff;
            box-shadow: none;
        }

        .auth-brand__mark .icon { width: 19px; height: 19px; }
        .auth-brand__text { display: flex; flex-direction: column; gap: 2px; }
        .auth-brand__text strong { font-size: 13px; font-weight: 800; letter-spacing: .03em; }
        .auth-brand__text small { color: var(--opal-blue); font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }

        .auth-heading { margin-bottom: 22px; }
        .auth-heading h1 { margin: 0 0 9px; font-family: "Source Serif 4", serif; font-size: 31px; line-height: 1.08; font-weight: 400; letter-spacing: -.035em; }
        .auth-heading p { margin: 0; color: var(--auth-muted); font-size: 12px; line-height: 1.55; }

        .auth-form { display: grid; gap: 16px; }
        .auth-field { display: grid; gap: 8px; }
        .auth-field label { color: #453330; font-size: 11px; font-weight: 700; }
        .auth-field input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid var(--auth-border);
            border-radius: 8px;
            outline: 0;
            background: var(--auth-surface-soft);
            color: var(--auth-text);
            font: inherit;
            font-size: 14px;
            transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
        }
        .auth-field input:focus { border-color: var(--opal-blue); background: #fff; box-shadow: 0 0 0 4px var(--auth-focus); }

        .auth-submit, .auth-primary-link {
            width: 100%;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 0;
            border-radius: 10px;
            background: var(--opal-blue-deep);
            color: #fff;
            font-size: 12px;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
            box-shadow: none;
        }
        .auth-submit:hover, .auth-primary-link:hover { background: var(--opal-blue-dark); }
        .auth-submit .icon, .auth-primary-link .icon { width: 15px; height: 15px; }

        .auth-secondary-link {
            display: inline-flex;
            justify-content: center;
            width: 100%;
            margin-top: 16px;
            color: var(--opal-blue-dark);
            font-size: 11px;
            font-weight: 750;
            text-decoration: none;
        }
        .auth-secondary-link:hover { text-decoration: underline; }

        .auth-errors {
            margin: 0;
            padding: 12px 13px;
            border: 1px solid #F2C9C3;
            border-radius: 11px;
            background: var(--auth-danger-soft);
            color: var(--auth-danger);
            font-size: 11px;
            line-height: 1.45;
        }

        .auth-field-error { color: var(--auth-danger); font-size: 10px; line-height: 1.35; }
        .auth-help { margin: -4px 0 0; color: var(--auth-muted); font-size: 10px; line-height: 1.5; }
        .auth-help ul { margin: 6px 0 0; padding-left: 17px; }

        .auth-status {
            padding: 14px 15px;
            border: 1px solid #eee8d6;
            border-radius: 12px;
            background: var(--auth-success-soft);
            color: var(--auth-success);
            font-size: 11px;
            line-height: 1.55;
        }

        .auth-footer {
            position: relative;
            margin-top: 26px;
            padding-top: 18px;
            text-align: center;
            color: #b9aa72;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .17em;
            text-transform: uppercase;
        }
        .auth-footer::before { content: ""; position: absolute; top: 0; left: 50%; width: 42px; height: 1px; transform: translateX(-50%); background: var(--opal-blue-border); }

        @media (max-width: 520px) {
            .auth-shell { padding: 20px 14px; }
            .auth-card { padding: 30px 22px 26px; border-radius: 18px; }
            .auth-heading h1 { font-size: 26px; }
        }
    

        .auth-theme-toggle{position:fixed;top:22px;right:24px;z-index:20;width:38px;height:38px;border:1px solid var(--auth-border);border-radius:10px;background:rgba(255,253,250,.86);color:var(--opal-blue-dark);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:.16s ease}
        .auth-theme-toggle:hover{transform:translateY(-1px);border-color:var(--opal-blue)}
        .auth-theme-toggle svg{width:17px;height:17px}.auth-theme-toggle__sun{display:none}
        html[data-theme="dark"] .auth-theme-toggle__moon{display:none}html[data-theme="dark"] .auth-theme-toggle__sun{display:block}
        html[data-theme="dark"]{color-scheme:dark;--opal-blue:#c0a264;--opal-blue-dark:#f0e8e0;--opal-blue-deep:#171311;--opal-blue-soft:#3a3022;--opal-blue-border:#44382f;--auth-bg:#171311;--auth-surface:#221c18;--auth-surface-soft:#2a221d;--auth-text:#eee6df;--auth-muted:#b8aca2;--auth-border:#44382f;--auth-danger:#e17a6d;--auth-danger-soft:#3b211f;--auth-success:#c0a264;--auth-success-soft:#2a221d;--auth-focus:rgba(192,162,100,.14)}
        html[data-theme="dark"] body.auth-body{background:linear-gradient(rgba(244,239,232,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(244,239,232,.018) 1px,transparent 1px),radial-gradient(circle at 12% 10%,rgba(192,162,100,.08),transparent 28%),radial-gradient(circle at 88% 88%,rgba(0,0,0,.12),transparent 30%),#171311!important;color:var(--auth-text)}
        html[data-theme="dark"] .auth-card{background:rgba(34,28,24,.98)!important;border-color:#44382f!important;box-shadow:0 22px 60px rgba(0,0,0,.34)!important}
        html[data-theme="dark"] .auth-card h1,html[data-theme="dark"] .auth-card h2,html[data-theme="dark"] .auth-title{color:#f4efe8!important}
        html[data-theme="dark"] .auth-card p,html[data-theme="dark"] .auth-subtitle,html[data-theme="dark"] .auth-help{color:#b8aca2!important}
        html[data-theme="dark"] input:not([type="checkbox"]):not([type="radio"]){background:#211b18!important;border-color:#4a3d34!important;color:#f1eae3!important}
        html[data-theme="dark"] input:focus{border-color:#c0a264!important;box-shadow:0 0 0 3px rgba(192,162,100,.13)!important}
        html[data-theme="dark"] .auth-theme-toggle{background:rgba(34,28,24,.88);border-color:#44382f;color:#eee6df}
        html[data-theme="dark"] .auth-theme-toggle:hover{background:#302720;border-color:#c0a264;color:#fff}
</style>
</head>
<body class="auth-body">
    <button type="button" class="auth-theme-toggle" data-auth-theme-toggle aria-label="Ativar modo noturno" title="Modo noturno">
        <svg class="auth-theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>
        <svg class="auth-theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"></path></svg>
    </button>
    {% include "components/icons.html" %}

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-brand__mark" aria-hidden="true">
                    <img src="{% static 'img/saari/saari-simbolo-gold.png' %}" alt="" style="width:20px;height:22px;object-fit:contain;">
                </span>
                <span class="auth-brand__text">
                    <strong>ALTO PADRÃO</strong>
                    <small>ERP</small>
                </span>
            </div>

            {% block content %}{% endblock %}

            <footer class="auth-footer">GLOBAL ENGENHARIA</footer>
        </section>
    </main>

    <script>
        (function(){
            const root=document.documentElement,button=document.querySelector('[data-auth-theme-toggle]'),meta=document.getElementById('saari-auth-theme-color');
            function apply(theme,persist){
                const dark=theme==='dark';root.dataset.theme=dark?'dark':'light';
                if(meta) meta.setAttribute('content',dark?'#171311':'#453330');
                if(button){button.setAttribute('title',dark?'Modo claro':'Modo noturno');button.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo noturno');button.setAttribute('aria-pressed',dark?'true':'false')}
                if(persist){try{localStorage.setItem('saari-theme',root.dataset.theme)}catch(e){}}
            }
            apply(root.dataset.theme,false);
            if(button) button.addEventListener('click',()=>apply(root.dataset.theme==='dark'?'light':'dark',true));
        })();
    </script>

</body>
</html>
