{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f6678">
    <title>{% block title %}Recuperar senha{% endblock %} | ERP Alto Padrão</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <style>
        :root {
            --opal-blue: #1D91A6;
            --opal-blue-dark: #0E5268;
            --opal-blue-deep: #0A4054;
            --opal-blue-soft: #DDF3F6;
            --opal-blue-border: #BDE6EC;
            --auth-bg: #F4F7F8;
            --auth-surface: #FFFFFF;
            --auth-surface-soft: #F8FAFB;
            --auth-text: #1B2528;
            --auth-muted: #6C7A80;
            --auth-border: #DCE6E8;
            --auth-danger: #B42318;
            --auth-danger-soft: #FFF5F4;
            --auth-success: #087A5A;
            --auth-success-soft: #EFFBF6;
            --auth-focus: rgba(29, 145, 166, .14);
        }

        html, body { min-height: 100%; }

        body.auth-body {
            margin: 0 !important;
            min-height: 100vh !important;
            color: var(--auth-text);
            background:
                linear-gradient(rgba(10, 64, 84, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 64, 84, .035) 1px, transparent 1px),
                radial-gradient(circle at 12% 10%, rgba(29, 145, 166, .12), transparent 28%),
                radial-gradient(circle at 88% 88%, rgba(14, 82, 104, .08), transparent 30%),
                var(--auth-bg) !important;
            background-size: 32px 32px, 32px 32px, auto, auto, auto;
            font-family: "Segoe UI", "Inter", Arial, sans-serif;
        }

        .auth-body * { box-sizing: border-box; }

        .auth-shell {
            min-height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            position: relative;
            width: min(100%, 470px);
            padding: 34px;
            background: rgba(255,255,255,.97);
            border: 1px solid rgba(189,230,236,.82);
            border-radius: 22px;
            box-shadow: 0 1px 2px rgba(10,64,84,.025), 0 18px 50px rgba(10,64,84,.10);
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--opal-blue-deep), var(--opal-blue), #41B3C6);
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .auth-brand__mark {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: var(--opal-blue-deep);
            color: #fff;
            box-shadow: 0 10px 22px rgba(10,64,84,.18);
        }

        .auth-brand__mark .icon { width: 19px; height: 19px; }
        .auth-brand__text { display: flex; flex-direction: column; gap: 2px; }
        .auth-brand__text strong { font-size: 13px; font-weight: 800; letter-spacing: .03em; }
        .auth-brand__text small { color: var(--opal-blue); font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }

        .auth-heading { margin-bottom: 22px; }
        .auth-heading h1 { margin: 0 0 9px; font-size: 28px; line-height: 1.08; font-weight: 760; letter-spacing: -.035em; }
        .auth-heading p { margin: 0; color: var(--auth-muted); font-size: 12px; line-height: 1.55; }

        .auth-form { display: grid; gap: 16px; }
        .auth-field { display: grid; gap: 8px; }
        .auth-field label { color: #4F6268; font-size: 11px; font-weight: 700; }
        .auth-field input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid var(--auth-border);
            border-radius: 13px;
            outline: 0;
            background: var(--auth-surface-soft);
            color: var(--auth-text);
            font: inherit;
            font-size: 14px;
            transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
        }
        .auth-field input:focus { border-color: var(--opal-blue); background: #fff; box-shadow: 0 0 0 4px var(--auth-focus); }

        .auth-submit, .auth-primary-link {
            width: 100%;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 0;
            border-radius: 13px;
            background: var(--opal-blue-deep);
            color: #fff;
            font-size: 12px;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(10,64,84,.18);
        }
        .auth-submit:hover, .auth-primary-link:hover { background: var(--opal-blue-dark); }
        .auth-submit .icon, .auth-primary-link .icon { width: 15px; height: 15px; }

        .auth-secondary-link {
            display: inline-flex;
            justify-content: center;
            width: 100%;
            margin-top: 16px;
            color: var(--opal-blue-dark);
            font-size: 11px;
            font-weight: 750;
            text-decoration: none;
        }
        .auth-secondary-link:hover { text-decoration: underline; }

        .auth-errors {
            margin: 0;
            padding: 12px 13px;
            border: 1px solid #F2C9C3;
            border-radius: 11px;
            background: var(--auth-danger-soft);
            color: var(--auth-danger);
            font-size: 11px;
            line-height: 1.45;
        }

        .auth-field-error { color: var(--auth-danger); font-size: 10px; line-height: 1.35; }
        .auth-help { margin: -4px 0 0; color: var(--auth-muted); font-size: 10px; line-height: 1.5; }
        .auth-help ul { margin: 6px 0 0; padding-left: 17px; }

        .auth-status {
            padding: 14px 15px;
            border: 1px solid #C9ECDD;
            border-radius: 12px;
            background: var(--auth-success-soft);
            color: var(--auth-success);
            font-size: 11px;
            line-height: 1.55;
        }

        .auth-footer {
            position: relative;
            margin-top: 26px;
            padding-top: 18px;
            text-align: center;
            color: #91A0A5;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .17em;
            text-transform: uppercase;
        }
        .auth-footer::before { content: ""; position: absolute; top: 0; left: 50%; width: 42px; height: 1px; transform: translateX(-50%); background: var(--opal-blue-border); }

        @media (max-width: 520px) {
            .auth-shell { padding: 20px 14px; }
            .auth-card { padding: 30px 22px 26px; border-radius: 18px; }
            .auth-heading h1 { font-size: 26px; }
        }
    </style>
</head>
<body class="auth-body">
    {% include "components/icons.html" %}

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-brand__mark" aria-hidden="true">
                    <svg class="icon"><use href="#icon-building"></use></svg>
                </span>
                <span class="auth-brand__text">
                    <strong>ALTO PADRÃO</strong>
                    <small>ERP</small>
                </span>
            </div>

            {% block content %}{% endblock %}

            <footer class="auth-footer">GLOBAL ENGENHARIA</footer>
        </section>
    </main>
</body>
</html>
