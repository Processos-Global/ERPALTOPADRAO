<style id="saari-system-theme">
:root{
  --saari-brown:#453330;--saari-brown-dark:#2d201c;--saari-brown-soft:#77655c;
  --saari-offwhite:#fbf9f4;--saari-background:#f5f1e9;--saari-surface:#fffdfa;
  --saari-surface-soft:#f8f4ed;--saari-line:#ded7c8;--saari-line-soft:#ece6dc;
  --saari-gold:#b9aa72;--saari-gold-soft:#eee8d6;--saari-text:#4b3a35;--saari-muted:#85776f;
  --saari-success:#77655c;--saari-danger:#9a463e;--saari-warning:#9a6d32;

  /* Compatibilidade com a paleta antiga: os módulos continuam usando as mesmas variáveis. */
  --ink:var(--saari-text);--ink-soft:var(--saari-brown-soft);--ink-muted:var(--saari-muted);
  --petrol-950:var(--saari-brown-dark);--petrol-900:var(--saari-brown);--petrol-850:#59453f;
  --petrol-800:#68544d;--petrol-700:var(--saari-gold);--petrol-500:#c8bc91;
  --petrol-200:#ddd3b4;--petrol-100:var(--saari-gold-soft);--petrol-50:#f8f4e8;
  --paper:var(--saari-background);--surface:var(--saari-surface);--cream:var(--saari-surface-soft);
  --line:rgba(69,51,48,.14);--success:var(--saari-success);--danger:var(--saari-danger);
  --font-sans:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;

  --cp-ink:var(--saari-brown);--cp-text:var(--saari-text);--cp-muted:var(--saari-muted);
  --cp-line:var(--saari-line);--cp-line-soft:var(--saari-line-soft);--cp-bg:var(--saari-background);
  --cp-card:var(--saari-surface);--cp-primary:var(--saari-brown);--cp-primary-dark:var(--saari-brown-dark);
  --cp-primary-soft:var(--saari-gold-soft);
  --fin-ink:var(--saari-brown);--fin-text:var(--saari-text);--fin-muted:var(--saari-muted);
  --fin-line:var(--saari-line);--fin-line-soft:var(--saari-line-soft);--fin-bg:var(--saari-background);
  --fin-card:var(--saari-surface);--fin-primary:var(--saari-brown);--fin-primary-dark:var(--saari-brown-dark);
  --fin-primary-soft:var(--saari-gold-soft);
  --usr-ink:var(--saari-brown);--usr-text:var(--saari-text);--usr-muted:var(--saari-muted);
  --usr-line:var(--saari-line);--usr-line-soft:var(--saari-line-soft);--usr-bg:var(--saari-background);
  --usr-card:var(--saari-surface);--usr-primary:var(--saari-brown);--usr-primary-dark:var(--saari-brown-dark);
  --usr-primary-soft:var(--saari-gold-soft);
  --obra-ink:var(--saari-brown);--obra-text:var(--saari-text);--obra-muted:var(--saari-muted);
  --obra-line:var(--saari-line);--obra-line-soft:var(--saari-line-soft);--obra-bg:var(--saari-background);
  --obra-card:var(--saari-surface);--obra-primary:var(--saari-brown);--obra-primary-dark:var(--saari-brown-dark);
  --obra-primary-soft:var(--saari-gold-soft);

  /* Tokens semânticos usados pelos dois modos */
  --saari-page:var(--saari-background);
  --saari-card:var(--saari-surface);
  --saari-card-soft:var(--saari-surface-soft);
  --saari-heading:var(--saari-brown);
  --saari-field:#fffdfa;
  --saari-field-hover:#fffaf4;
  --saari-table-head:#f7f2e9;
  --saari-table-hover:#fcf9f3;
  --saari-topbar:rgba(251,249,244,.94);
  --saari-shadow:rgba(69,51,48,.10);
}

html[data-theme="dark"]{
  color-scheme:dark;
  --saari-brown:#e8dfd5;
  --saari-brown-dark:#171311;
  --saari-brown-soft:#c2b5aa;
  --saari-offwhite:#191512;
  --saari-background:#171311;
  --saari-surface:#221c18;
  --saari-surface-soft:#2a221d;
  --saari-line:#44382f;
  --saari-line-soft:#352c27;
  --saari-gold:#c0a264;
  --saari-gold-soft:#3a3022;
  --saari-text:#f1eae3;
  --saari-muted:#b8aca2;
  --saari-success:#8fab98;
  --saari-danger:#e17a6d;
  --saari-warning:#d2a25e;

  --ink:var(--saari-text);--ink-soft:var(--saari-brown-soft);--ink-muted:var(--saari-muted);
  --petrol-950:#171311;--petrol-900:#221c18;--petrol-850:#302720;--petrol-800:#4b3b32;
  --petrol-700:var(--saari-gold);--petrol-500:#a98c58;--petrol-200:#594936;--petrol-100:#3a3022;--petrol-50:#29221c;
  --paper:var(--saari-background);--surface:var(--saari-surface);--cream:var(--saari-surface-soft);
  --line:rgba(244,239,232,.10);--success:var(--saari-success);--danger:var(--saari-danger);

  --cp-ink:var(--saari-text);--cp-text:var(--saari-text);--cp-muted:var(--saari-muted);
  --cp-line:var(--saari-line);--cp-line-soft:var(--saari-line-soft);--cp-bg:var(--saari-background);
  --cp-card:var(--saari-surface);--cp-primary:#80634d;--cp-primary-dark:#5f493b;--cp-primary-soft:var(--saari-gold-soft);
  --fin-ink:var(--saari-text);--fin-text:var(--saari-text);--fin-muted:var(--saari-muted);
  --fin-line:var(--saari-line);--fin-line-soft:var(--saari-line-soft);--fin-bg:var(--saari-background);
  --fin-card:var(--saari-surface);--fin-primary:#80634d;--fin-primary-dark:#5f493b;--fin-primary-soft:var(--saari-gold-soft);
  --usr-ink:var(--saari-text);--usr-text:var(--saari-text);--usr-muted:var(--saari-muted);
  --usr-line:var(--saari-line);--usr-line-soft:var(--saari-line-soft);--usr-bg:var(--saari-background);
  --usr-card:var(--saari-surface);--usr-primary:#80634d;--usr-primary-dark:#5f493b;--usr-primary-soft:var(--saari-gold-soft);
  --obra-ink:var(--saari-text);--obra-text:var(--saari-text);--obra-muted:var(--saari-muted);
  --obra-line:var(--saari-line);--obra-line-soft:var(--saari-line-soft);--obra-bg:var(--saari-background);
  --obra-card:var(--saari-surface);--obra-primary:#80634d;--obra-primary-dark:#5f493b;--obra-primary-soft:var(--saari-gold-soft);

  --saari-page:#171311;--saari-card:#221c18;--saari-card-soft:#2a221d;--saari-heading:#f4efe8;
  --saari-field:#211b18;--saari-field-hover:#28211d;--saari-table-head:#2b231e;--saari-table-hover:#2a221d;
  --saari-topbar:rgba(28,23,20,.94);--saari-shadow:rgba(0,0,0,.30);
}

html{background:var(--saari-brown-dark)!important}
body.app-body{background:var(--saari-background)!important;color:var(--saari-text)!important;font-family:var(--font-sans)!important}
.app-content,.page-content{background:var(--saari-background)!important}

/* Sidebar e navegação */
.sidebar{background:linear-gradient(180deg,#3b2a26 0%,#2d201c 100%)!important;border-right:1px solid rgba(185,170,114,.15)}
.brand__mark{border-color:rgba(185,170,114,.44)!important;background:rgba(255,255,255,.025)!important}
.brand__mark img,.page-transition__mark img{display:block;width:58%;height:58%;object-fit:contain}
.brand__content strong{font-family:var(--font-serif)!important;font-weight:400!important;letter-spacing:.015em}
.brand__content small,.sidebar__section-title,.sidebar__modules-header small{color:rgba(244,239,231,.54)!important}
.sidebar-link{color:rgba(251,249,244,.72)!important;border-radius:7px}
.sidebar-link:hover{background:rgba(185,170,114,.09)!important;color:#fff!important}
.sidebar-link--active{background:rgba(185,170,114,.14)!important;border-left-color:var(--saari-gold)!important;color:#fff!important}
.sidebar-link--active .sidebar-link__icon,.sidebar-sublink--active{color:#eee1b5!important}
.sidebar-submenu{border-left-color:rgba(185,170,114,.16)!important}
.sidebar-sublink:hover{background:rgba(185,170,114,.07)!important}
.sidebar-sublink--active{background:rgba(185,170,114,.10)!important}
.sidebar-sublink__dot{background:rgba(251,249,244,.28)!important}.sidebar-sublink--active .sidebar-sublink__dot{background:var(--saari-gold)!important}
.project-card{background:rgba(255,255,255,.045)!important;border-color:rgba(185,170,114,.13)!important}
.user-summary__avatar{background:rgba(185,170,114,.14)!important;color:#fff!important}
.sidebar-logout:hover{background:rgba(185,170,114,.08)!important}

/* Topbar */
.topbar{background:rgba(251,249,244,.94)!important;border-bottom-color:rgba(69,51,48,.10)!important;backdrop-filter:blur(16px)}
.topbar__eyebrow,.page-eyebrow{color:var(--saari-brown-soft)!important}
.topbar__title,.page-title{color:var(--saari-brown)!important;font-family:var(--font-serif)!important;font-weight:400!important}
.topbar__status{background:var(--saari-gold)!important;color:var(--saari-brown-dark)!important}
.topbar button,.notification-center__toggle{border-color:rgba(69,51,48,.12)!important;background:#fffaf3!important;color:var(--saari-brown)!important}
.notification-center__panel{border-color:var(--saari-line)!important;background:var(--saari-surface)!important;box-shadow:0 18px 48px rgba(69,51,48,.13)!important}
.notification-center__header,.notification-center__footer{border-color:var(--saari-line-soft)!important}
.notification-center__header strong,.notification-center__content strong{color:var(--saari-brown)!important}
.notification-center__header span,.notification-center__content span,.notification-center__content small,.notification-center__empty{color:var(--saari-muted)!important}
.notification-center__item{border-color:var(--saari-line-soft)!important}.notification-center__item:hover{background:var(--saari-surface-soft)!important}
.notification-center__item.is-unread .notification-center__dot{background:var(--saari-gold)!important}
.notification-center__footer a{color:var(--saari-brown)!important}

/* Transição */
.page-transition{background:var(--saari-brown-dark)!important}
.page-transition__mark{border-color:rgba(185,170,114,.46)!important;background:rgba(255,255,255,.02)!important}

/* Hierarquia e superfícies compartilhadas */
h1,h2,h3,.cp-title,.cad-title,.fin-title,.usr-title,.obra-title{color:var(--saari-brown)!important}
.cp-title,.cad-title,.fin-title,.usr-title,.obra-title{font-family:var(--font-serif)!important;font-weight:400!important;letter-spacing:-.025em!important}
.cp-eyebrow,.cad-eyebrow,.fin-eyebrow,.usr-eyebrow,.obra-eyebrow{color:var(--saari-brown-soft)!important}
.cp-page,.cad-page,.fin-page,.usr-page,.obra-page{color:var(--saari-text)!important;font-family:var(--font-sans)!important}
.cp-card,.cp-section,.cad-card,.cad-toolbar,.cad-table-wrap,.cad-form-card,
.fin-card,.fin-section,.usr-card,.usr-section,.obra-card,.obra-section{background:var(--saari-surface)!important;border-color:var(--saari-line)!important;box-shadow:0 1px 2px rgba(69,51,48,.025)!important}
.cp-section__head,.cad-form-card__head,.fin-section__head,.usr-section__head,.obra-section__head{background:#faf7f1!important;border-color:var(--saari-line-soft)!important}

/* Cabeçalhos destacados das telas */
.cad-head,.usr-head,.fin-head,.obra-head,.cp-head-card{
  border-color:var(--saari-line)!important;
  background:linear-gradient(135deg,#fffdfa 0%,#faf7f1 66%,#f3ecdc 100%)!important;
  box-shadow:0 12px 34px rgba(69,51,48,.055)!important;
}
.cad-head::before,.usr-head::before,.fin-head::before,.obra-head::before,.cp-head-card::before{background:linear-gradient(180deg,var(--saari-gold),var(--saari-brown))!important}
.cad-head::after,.usr-head::after,.fin-head::after,.obra-head::after,.cp-head-card::after{background:rgba(185,170,114,.08)!important}

/* Formulários */
input:not([type="checkbox"]):not([type="radio"]),select,textarea,
.cp-input,.cad-input,.fin-input,.usr-input,.obra-input{
  border-color:#d9d0c2!important;background:#fffdfa!important;color:var(--saari-text)!important;border-radius:8px!important;
}
input:not([type="checkbox"]):not([type="radio"]):hover,select:hover,textarea:hover{border-color:#c7baa7!important}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus,
.cp-input:focus,.cad-input:focus,.fin-input:focus,.usr-input:focus,.obra-input:focus{
  outline:none!important;border-color:var(--saari-gold)!important;box-shadow:0 0 0 3px rgba(185,170,114,.12)!important;background:#fff!important;
}
label,.cp-field label,.cad-field label,.fin-field label,.usr-field label,.obra-field label{color:var(--saari-brown-soft)!important}

/* Botões e links principais */
.cp-btn--primary,.cad-btn:not(.cad-btn--secondary):not(.cad-btn--danger),.fin-btn--primary,.usr-btn--primary,.obra-btn--primary,
button.btn-primary,a.btn-primary{background:var(--saari-brown)!important;border-color:var(--saari-brown)!important;color:#fff!important;box-shadow:none!important}
.cp-btn--primary:hover,.cad-btn:not(.cad-btn--secondary):not(.cad-btn--danger):hover,.fin-btn--primary:hover,.usr-btn--primary:hover,.obra-btn--primary:hover,
button.btn-primary:hover,a.btn-primary:hover{background:var(--saari-brown-dark)!important;border-color:var(--saari-brown-dark)!important}
.cp-btn--soft,.fin-btn--soft,.usr-btn--soft,.obra-btn--soft{background:var(--saari-gold-soft)!important;border-color:#ddd1aa!important;color:var(--saari-brown)!important}
.cp-btn,.cad-btn--secondary,.fin-btn,.usr-btn,.obra-btn{border-color:#d9d0c2!important}
.cp-btn:hover,.cad-btn--secondary:hover,.fin-btn:hover,.usr-btn:hover,.obra-btn:hover{border-color:var(--saari-gold)!important;color:var(--saari-brown)!important;box-shadow:0 0 0 3px rgba(185,170,114,.08)!important}
a:not(.sidebar-link):not(.sidebar-sublink):not(.brand):not(.btn):not([class*="danger"]){text-decoration-color:rgba(119,101,92,.35)}

/* Tabelas */
.cp-table th,.cad-table th,.fin-table th,.usr-table th,.obra-table th{background:#f7f2e9!important;color:var(--saari-brown-soft)!important;border-color:var(--saari-line)!important}
.cp-table td,.cad-table td,.fin-table td,.usr-table td,.obra-table td{color:var(--saari-text)!important;border-color:var(--saari-line-soft)!important}
.cp-table tbody tr:hover,.cad-table tbody tr:hover,.fin-table tbody tr:hover,.usr-table tbody tr:hover,.obra-table tbody tr:hover{background:#fcf9f3!important}

/* Elementos de acento */
.cp-process-card__number,.cp-order__number,.cad-link,.fin-link,.usr-link,.obra-link{color:var(--saari-brown)!important}
.cp-badge--active,.fin-badge--active,.usr-badge--active,.obra-badge--active{background:var(--saari-gold-soft)!important;color:var(--saari-brown)!important}
.cp-receipt-bar span,.progress span,[class*="progress"] > span{background:var(--saari-gold)!important}

/* Mantém cores funcionais de estados, mas com saturação mais elegante. */
.messages .success,[class*="badge--ok"],[class*="status--ok"],[class*="success"]{filter:saturate(.78)}
.messages .error,[class*="badge--danger"],[class*="status--danger"]{filter:saturate(.80)}

::selection{background:rgba(185,170,114,.28);color:var(--saari-brown-dark)}


/* Feedback do sistema — linguagem visual SAARI */
.messages{
  position:fixed!important;top:76px!important;right:24px!important;z-index:5000!important;
  width:min(410px,calc(100vw - 32px))!important;display:grid!important;gap:9px!important;
  margin:0!important;pointer-events:none!important;
}
.messages .message{
  position:relative!important;display:grid!important;grid-template-columns:34px minmax(0,1fr) 28px!important;
  align-items:center!important;gap:10px!important;min-height:58px!important;padding:10px 10px 10px 12px!important;
  border:1px solid var(--saari-line)!important;border-radius:12px!important;background:rgba(255,253,250,.98)!important;
  color:var(--saari-text)!important;box-shadow:0 14px 38px rgba(69,51,48,.12)!important;
  backdrop-filter:blur(14px)!important;pointer-events:auto!important;overflow:hidden!important;
}
.messages .message::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--saari-gold)}
.messages .message--error::before,.messages .message--danger::before{background:var(--saari-danger)}
.messages .message--warning::before{background:var(--saari-warning)}
.message__icon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--saari-gold-soft);color:var(--saari-brown)}
.message--error .message__icon,.message--danger .message__icon{background:#f7e9e6;color:var(--saari-danger)}
.message--warning .message__icon{background:#f4ecdf;color:var(--saari-warning)}
.message__icon svg{width:17px;height:17px}
.message__copy{min-width:0;display:grid;gap:2px}
.message__copy strong{font-size:11px;line-height:1.2;color:var(--saari-brown);font-weight:700;letter-spacing:.01em}
.message__copy span{font-size:12px;line-height:1.45;color:var(--saari-text)}
.message__close{width:28px!important;height:28px!important;border:0!important;border-radius:7px!important;background:transparent!important;color:var(--saari-muted)!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important}
.message__close:hover{background:var(--saari-surface-soft)!important;color:var(--saari-brown)!important}
.message__close .icon{width:14px;height:14px}

/* Confirmação de saída — discreta, sem tom alarmista */
.logout-dialog{position:fixed;inset:0;z-index:7000;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .16s ease,visibility .16s ease}
.logout-dialog.is-open{opacity:1;visibility:visible}
.logout-dialog__backdrop{position:absolute;inset:0;background:rgba(45,32,28,.32);backdrop-filter:blur(4px)}
.logout-dialog__card{position:relative;width:min(390px,100%);border:1px solid rgba(69,51,48,.13);border-radius:16px;background:var(--saari-surface);box-shadow:0 28px 70px rgba(45,32,28,.22);padding:22px}
.logout-dialog__top{display:flex;align-items:flex-start;gap:13px}
.logout-dialog__icon{flex:0 0 38px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--saari-gold-soft);color:var(--saari-brown)}
.logout-dialog__icon svg{width:18px;height:18px}
.logout-dialog__copy h2{margin:0!important;font-family:var(--font-serif)!important;font-size:22px!important;font-weight:400!important;line-height:1.15;color:var(--saari-brown)!important}
.logout-dialog__copy p{margin:6px 0 0;font-size:12px;line-height:1.55;color:var(--saari-muted)}
.logout-dialog__actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--saari-line-soft)}
.logout-dialog__btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid #d9d0c2;background:#fffdfa;color:var(--saari-brown);font:600 12px var(--font-sans);cursor:pointer}
.logout-dialog__btn:hover{border-color:var(--saari-gold);background:#faf7f1}
.logout-dialog__btn--primary{border-color:var(--saari-brown);background:var(--saari-brown);color:#fff}
.logout-dialog__btn--primary:hover{border-color:var(--saari-brown-dark);background:var(--saari-brown-dark);color:#fff}
@media(max-width:640px){.messages{top:68px!important;right:16px!important}.logout-dialog__actions{display:grid;grid-template-columns:1fr 1fr}.logout-dialog__btn{width:100%}}


/* ============================================================
   SAARI — MODO NOTURNO
   Mantém a identidade quente da marca; não é inversão automática.
   ============================================================ */
html[data-theme="dark"]{background:#171311!important}
html[data-theme="dark"] body.app-body,
html[data-theme="dark"] .app-content,
html[data-theme="dark"] .page-content,
html[data-theme="dark"] main{background:var(--saari-background)!important;color:var(--saari-text)!important}

/* Barra superior e navegação */
html[data-theme="dark"] .topbar{background:var(--saari-topbar)!important;border-bottom-color:rgba(244,239,232,.08)!important}
html[data-theme="dark"] .topbar button,
html[data-theme="dark"] .notification-center__toggle,
html[data-theme="dark"] .notification-center__button,
html[data-theme="dark"] .theme-toggle{background:#241e1a!important;border-color:#3d332c!important;color:#eee6de!important}
html[data-theme="dark"] .topbar button:hover,
html[data-theme="dark"] .notification-center__button:hover,
html[data-theme="dark"] .theme-toggle:hover{background:#302720!important;border-color:#5a493b!important;color:#fff!important}
html[data-theme="dark"] .topbar__account-text{color:#d9cec4!important}
html[data-theme="dark"] .notification-center__panel{background:#221c18!important;border-color:#44382f!important;box-shadow:0 22px 58px rgba(0,0,0,.36)!important}
html[data-theme="dark"] .notification-center__item:hover{background:#2a221d!important}
html[data-theme="dark"] .notification-center__header,
html[data-theme="dark"] .notification-center__footer,
html[data-theme="dark"] .notification-center__item{border-color:#352c27!important}
html[data-theme="dark"] .notification-center__header strong,
html[data-theme="dark"] .notification-center__content strong,
html[data-theme="dark"] .notification-center__footer a{color:#f4efe8!important}

/* Toggle claro/noturno */
.theme-toggle{width:38px;height:38px;min-width:38px;padding:0!important;border:1px solid rgba(69,51,48,.12)!important;border-radius:9px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;background:#fffaf3!important;color:var(--saari-brown)!important;cursor:pointer;transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease}
.theme-toggle:hover{border-color:var(--saari-gold)!important;background:#faf5ea!important;transform:translateY(-1px)}
.theme-toggle svg{width:17px;height:17px;display:block}
.theme-toggle__sun{display:none}
html[data-theme="dark"] .theme-toggle__moon{display:none}
html[data-theme="dark"] .theme-toggle__sun{display:block}

/* Tipografia */
html[data-theme="dark"] body,
html[data-theme="dark"] p,
html[data-theme="dark"] td,
html[data-theme="dark"] li{color:var(--saari-text)}
html[data-theme="dark"] h1,
html[data-theme="dark"] h2,
html[data-theme="dark"] h3,
html[data-theme="dark"] h4,
