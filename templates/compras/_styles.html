<style>
:root{
  --cp-ink:#453330;--cp-text:#4b3a35;--cp-muted:#85776f;--cp-line:#ded7c8;--cp-line-soft:#ece6dc;
  --cp-bg:#f5f1e9;--cp-card:#FFFFFF;--cp-primary:#77655c;--cp-primary-dark:#453330;--cp-primary-soft:#eee8d6;
  --cp-ok:#453330;--cp-ok-bg:#f5f1e9;--cp-warn:#92400E;--cp-warn-bg:#FFF7ED;--cp-danger:#B91C1C;--cp-danger-bg:#FEF2F2;
  --cp-shadow:0 2px 8px rgba(45,32,28,.06);
}
body > .app-shell > .app-content > .page-content{max-width:none!important;margin:0!important;padding:18px 0 0!important;min-height:100vh!important;background:var(--cp-bg)!important}
.cp-page,.cp-page *{box-sizing:border-box}
.cp-page{width:100%;max-width:none;margin:0;padding:18px 22px 28px;color:var(--cp-text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
.cp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}.cp-head__copy{min-width:0}.cp-eyebrow{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--cp-primary)}.cp-title{margin:4px 0 5px;color:var(--cp-ink);font-size:26px;line-height:1.08;letter-spacing:-.025em;font-weight:750}.cp-sub{max-width:900px;color:var(--cp-muted);font-size:11px;line-height:1.45}.cp-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.cp-btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 12px;border:1px solid #d9d0c2;border-radius:6px;background:#fff;color:#4b3a35;text-decoration:none;font:inherit;font-size:10px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}.cp-btn:hover{border-color:#b9aa72;color:#77655c;box-shadow:0 0 0 3px rgba(119,101,92,.06)}.cp-btn--primary{background:var(--cp-primary);border-color:var(--cp-primary);color:#fff}.cp-btn--primary:hover{background:var(--cp-primary-dark);color:#fff}.cp-btn--soft{background:var(--cp-primary-soft);border-color:#ddd1aa;color:#77655c}.cp-btn--danger{background:#fff;border-color:#FCA5A5;color:var(--cp-danger)}.cp-btn--sm{min-height:30px;padding:5px 9px;font-size:9px}.cp-btn:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}
.cp-card,.cp-section{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:9px;box-shadow:0 1px 3px rgba(45,32,28,.04)}.cp-section{margin-bottom:14px;overflow:hidden}.cp-section__head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 15px;border-bottom:1px solid var(--cp-line-soft);background:#faf7f1}.cp-section__title{margin:0;color:var(--cp-ink);font-size:14px;font-weight:800}.cp-section__desc{margin:3px 0 0;color:var(--cp-muted);font-size:10px}.cp-section__body{padding:15px}
.cp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}.cp-kpi{padding:13px 14px;border:1px solid var(--cp-line);border-radius:8px;background:#fff}.cp-kpi span{display:block;color:var(--cp-muted);font-size:9px;font-weight:600}.cp-kpi strong{display:block;margin-top:4px;color:var(--cp-ink);font-size:20px;font-weight:800}.cp-kpi small{display:block;margin-top:3px;color:var(--cp-muted);font-size:9px;line-height:1.35}
.cp-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:14px;border:1px solid var(--cp-line);border-radius:8px;overflow:hidden;background:var(--cp-line)}.cp-summary__item{padding:12px 14px;background:#fff;min-width:0}.cp-summary__item span{display:block;color:var(--cp-muted);font-size:9px}.cp-summary__item strong{display:block;margin-top:3px;color:#2d201c;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:5px;background:#f1ece4;color:#66534c;font-size:9px;font-weight:800;white-space:nowrap}.cp-badge--active{background:var(--cp-primary-soft);color:#77655c}.cp-badge--ok{background:var(--cp-ok-bg);color:var(--cp-ok)}.cp-badge--warn{background:var(--cp-warn-bg);color:var(--cp-warn)}.cp-badge--danger{background:var(--cp-danger-bg);color:var(--cp-danger)}
.cp-filter{display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(150px,1fr)) auto;gap:8px;padding:11px;margin-bottom:14px;border:1px solid var(--cp-line);border-radius:8px;background:#fff}.cp-input{width:100%;min-height:36px;padding:7px 10px;border:1px solid #d9d0c2;border-radius:6px;background:#fff;color:#4b3a35;font:inherit;font-size:10px;outline:none;transition:border .15s,box-shadow .15s}.cp-input:focus{border-color:#b9aa72;box-shadow:0 0 0 3px rgba(119,101,92,.07)}textarea.cp-input{min-height:68px;resize:vertical}select[multiple].cp-input{min-height:180px;padding:7px}.cp-field{margin-bottom:10px}.cp-field label{display:block;margin-bottom:5px;color:#66534c;font-size:9px;font-weight:600}.cp-help,.cp-muted{color:var(--cp-muted);font-size:9px;line-height:1.45}.cp-error{margin-top:4px;color:var(--cp-danger);font-size:8px}.cp-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}.cp-form-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}.cp-form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--cp-line-soft)}
.cp-table-wrap{overflow:auto;border-radius:7px}.cp-table{width:100%;border-collapse:collapse;font-size:10px}.cp-table th{padding:10px 11px;border-bottom:1px solid var(--cp-line);background:#f8f4ed;color:#66534c;text-align:left;font-size:9px;font-weight:700;white-space:nowrap}.cp-table td{padding:10px 11px;border-bottom:1px solid var(--cp-line-soft);vertical-align:top;color:#4b3a35}.cp-table tbody tr:hover{background:#fcf9f3}.cp-table tr:last-child td{border-bottom:0}.cp-money{white-space:nowrap;font-variant-numeric:tabular-nums}.cp-empty{padding:28px 18px!important;text-align:center;color:#a39890!important;font-size:10px}
.cp-board{display:grid;grid-template-columns:repeat(6,minmax(240px,1fr));gap:9px;overflow-x:auto;padding-bottom:8px}.cp-column{min-width:240px;padding:7px;border:1px solid var(--cp-line);border-radius:8px;background:#f8f4ed}.cp-column__head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 5px 9px;color:#4b3a35;font-size:10px;font-weight:800}.cp-count{padding:2px 6px;border-radius:5px;background:#ded7c8;color:#66534c;font-size:9px}.cp-process-card{display:block;margin-bottom:7px;padding:11px;border:1px solid #ded7c8;border-radius:7px;background:#fff;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}.cp-process-card:hover{border-color:#d9cfb0;box-shadow:var(--cp-shadow)}.cp-process-card__top{display:flex;justify-content:space-between;gap:8px}.cp-process-card__number{font-size:9px;font-weight:800;color:var(--cp-primary)}.cp-process-card__title{margin:6px 0 4px;color:var(--cp-ink);font-size:11px;font-weight:800;line-height:1.35}.cp-process-card__meta{color:var(--cp-muted);font-size:9px;line-height:1.45}.cp-process-card__foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--cp-line-soft);font-size:9px;color:#85776f}
.cp-order{margin-bottom:10px;border:1px solid var(--cp-line);border-radius:9px;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(45,32,28,.04)}.cp-order__head{display:grid;grid-template-columns:minmax(230px,1.5fr) minmax(120px,.7fr) minmax(120px,.7fr) minmax(130px,.75fr) minmax(130px,.65fr);gap:12px;align-items:center;padding:13px 15px}.cp-order__number{margin-bottom:3px;color:var(--cp-primary);font-size:10px;font-weight:800}.cp-order__value{text-align:right;color:var(--cp-ink);font-size:15px;font-weight:800}.cp-order__body{padding:13px;border-top:1px solid var(--cp-line-soft);background:#faf7f1}.cp-receipt-bar{height:5px;border-radius:999px;background:#ded7c8;overflow:hidden}.cp-receipt-bar span{display:block;height:100%;border-radius:999px;background:var(--cp-primary)}
.cp-disclosure{border:1px solid var(--cp-line);border-radius:7px;background:#fff;overflow:hidden}.cp-disclosure+.cp-disclosure{margin-top:7px}.cp-disclosure>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;cursor:pointer;list-style:none;color:#4b3a35;font-size:10px;font-weight:700}.cp-disclosure>summary::-webkit-details-marker{display:none}.cp-disclosure[open]>summary{border-bottom:1px solid var(--cp-line-soft);background:#faf7f1}.cp-disclosure__body{padding:11px}.cp-note{padding:10px 11px;border:1px solid #d9d0c2;border-radius:7px;background:#f8f4ed;color:#85776f;font-size:10px;line-height:1.5}.cp-note--ok{border-color:#eee8d6;background:var(--cp-ok-bg);color:#453330}.cp-note--warn{border-color:#FED7AA;background:var(--cp-warn-bg);color:#92400E}.cp-note--danger{border-color:#FECACA;background:var(--cp-danger-bg);color:#991B1B}
@media(max-width:1100px){.cp-page{padding:18px 14px 24px}.cp-filter{grid-template-columns:1fr 1fr}.cp-kpis,.cp-summary{grid-template-columns:repeat(2,1fr)}.cp-order__head{grid-template-columns:1fr 1fr}.cp-order__value{text-align:left}}
@media(max-width:680px){.cp-head{flex-direction:column}.cp-actions{justify-content:flex-start}.cp-filter,.cp-kpis,.cp-summary,.cp-form-grid,.cp-form-grid--3{grid-template-columns:1fr}.cp-page{padding:14px 9px 22px}.cp-title{font-size:23px}}
</style>


<style>
.pc-flow-callout{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 18px;margin-bottom:16px;border:1px solid #d9d0c2;background:#fffdfa;border-radius:12px}.pc-flow-callout>div{display:grid;gap:4px}.pc-flow-callout strong{font-size:13px;color:#2d201c}.pc-flow-callout small{font-size:11px;color:#77655c}.pc-flow-step{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#453330}.pc-note--info{border-color:#d9d0c2;background:#f5f1e9;color:#66534c}.pc-proposal-state{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.pc-proposal-state.is-sent{background:#f5f1e9;color:#453330;border:1px solid #eee8d6}.pc-quote-map{overflow:hidden}.pc-map-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:9px;font-weight:700;color:#77655c}.pc-map-legend span{display:inline-flex;align-items:center;gap:5px}.pc-map-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}.pc-map-legend .price{background:#b9aa72}.pc-map-legend .deadline{background:#f0b429}.pc-map-legend .rating{background:#77655c}.pc-map-wrap{overflow:auto;max-width:100%}.pc-map-table{border-collapse:separate;border-spacing:0;min-width:920px;width:100%;font-size:10px}.pc-map-table th,.pc-map-table td{padding:10px 12px;border-right:1px solid #eee8d6;border-bottom:1px solid #eee8d6;vertical-align:middle;text-align:center;background:#fff}.pc-map-table thead th{position:sticky;top:0;z-index:5;background:#f5f1e9;color:#66534c;font-size:10px}.pc-map-table .supplier-col{min-width:170px;background:#f3e0d0}.pc-map-table .sticky-col{position:sticky;left:0;z-index:3;text-align:left;background:#fff}.pc-map-table thead .sticky-col{z-index:7;background:#453330;color:#fff}.pc-map-table .item-col{min-width:250px;max-width:310px}.pc-map-table .qty-col{left:250px;min-width:80px;text-align:center}.pc-map-table td.item-col strong{display:block;font-size:10px;color:#2d201c}.pc-map-table td.item-col small,.pc-map-table td.qty-col small{display:block;margin-top:2px;font-size:9px;color:#77655c}.pc-map-offer span{display:block;color:#77655c;font-size:9px}.pc-map-offer strong{display:block;margin-top:3px;font-size:11px;color:#2d201c}.pc-map-offer em{display:inline-block;margin-top:5px;padding:2px 6px;border-radius:999px;background:#f5f1e9;color:#453330;font-size:8px;font-style:normal;font-weight:800}.pc-map-offer.is-best-price{background:#eee8d6}.pc-map-empty{color:#b9aa72!important}.pc-map-badges{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:5px}.pc-map-badges span{padding:2px 5px;border-radius:999px;font-size:7px;font-weight:800;text-transform:uppercase}.pc-map-badges .is-deadline{background:#fff0c5;color:#8a5a00}.pc-map-badges .is-rating{background:#f5f1e9;color:#453330}.pc-map-badges .is-sent{background:#f5f1e9;color:#453330}.pc-map-table tfoot th{font-weight:800;color:#66534c;background:#f8fafb}.pc-map-table tfoot td{font-weight:700}.pc-map-table tfoot .is-best-meta{background:#f5f1e9;color:#453330}.pc-saved-bar small{display:block;margin-top:3px;color:#77655c}.pc-provider-head-actions form{margin:0}
@media(max-width:900px){.pc-flow-callout{align-items:flex-start;flex-direction:column}.pc-map-table .item-col{min-width:210px}.pc-map-table .qty-col{left:210px}.pc-map-legend{display:none}}

/* 2026 refresh: hero-card dos titulos de Compras */
.cp-head{position:relative;overflow:hidden;align-items:center;margin-bottom:20px;padding:21px 23px;border:1px solid #ded7c8;border-radius:16px;background:linear-gradient(135deg,#fff 0%,#fcfaf6 62%,#f3ecdc 100%);box-shadow:0 12px 34px rgba(69,51,48,.065)}
.cp-head::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--cp-primary),#2d201c)}
.cp-head::after{content:"";position:absolute;right:-74px;top:-105px;width:170px;height:170px;border-radius:50%;background:rgba(119,101,92,.065);pointer-events:none}
.cp-head__copy,.cp-actions{position:relative;z-index:1}.cp-eyebrow{font-size:9px;letter-spacing:.13em;font-weight:850}.cp-title{margin:6px 0 6px;font-size:30px;font-weight:850;letter-spacing:-.038em}.cp-sub{font-size:11px;line-height:1.55;color:#77655c}.cp-actions{align-items:center}
@media(max-width:680px){.cp-head{align-items:flex-start;padding:18px 17px 18px 20px;border-radius:14px}.cp-title{font-size:25px}.cp-head::after{display:none}}

</style>
