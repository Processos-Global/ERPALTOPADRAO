<style>

.cp-page,.cp-page *{box-sizing:border-box}

.cp-table-wrap{overflow:auto;overscroll-behavior-inline:contain;border-radius:7px}.cp-table{width:100%;border-collapse:collapse;font-size:10px}.cp-table th{padding:10px 11px;border-bottom:1px solid var(--cp-line);background:var(--saari-hover);color:var(--saari-text);text-align:left;font-size:9px;font-weight:700;white-space:nowrap}.cp-table td{padding:10px 11px;border-bottom:1px solid var(--cp-line-soft);vertical-align:top;color:var(--saari-text)}.cp-table tbody tr:hover{background:var(--saari-hover)}.cp-table tr:last-child td{border-bottom:0}.cp-money{white-space:nowrap;font-variant-numeric:tabular-nums}.cp-empty{padding:28px 18px!important;text-align:center;color:var(--saari-text-muted)!important;font-size:10px}

<style>

.cp-head{position:relative;overflow:hidden;align-items:center;margin-bottom:20px;padding:16px 20px;border:1px solid var(--saari-border);border-radius:var(--saari-radius);background:var(--cp-card);box-shadow:var(--cp-shadow)}
