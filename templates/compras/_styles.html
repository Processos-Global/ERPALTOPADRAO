<style>
:root{
  --cp-ink:#183746;--cp-text:#345260;--cp-muted:#748893;--cp-line:#dbe5e9;--cp-line-soft:#edf2f4;
  --cp-bg:#f5f8f9;--cp-card:#fff;--cp-primary:#078fa5;--cp-primary-dark:#067a8e;--cp-primary-soft:#eaf7f9;
  --cp-ok:#327257;--cp-ok-bg:#edf7f2;--cp-warn:#96651f;--cp-warn-bg:#fff7e8;--cp-danger:#a44747;--cp-danger-bg:#fff1f1;
  --cp-shadow:0 12px 34px rgba(28,64,78,.07);
}
.cp-page,.cp-page *{box-sizing:border-box}.cp-page{width:100%;max-width:1640px;margin:0 auto;padding:28px 30px 72px;color:var(--cp-text)}
.cp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:20px}.cp-head__copy{min-width:0}.cp-eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:850;color:var(--cp-primary)}.cp-title{margin:5px 0 5px;color:var(--cp-ink);font-size:28px;line-height:1.15;letter-spacing:-.02em}.cp-sub{max-width:900px;color:var(--cp-muted);font-size:13px;line-height:1.55}.cp-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.cp-btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border:1px solid #cad9de;border-radius:9px;background:#fff;color:#31515f;text-decoration:none;font:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.16s ease}.cp-btn:hover{transform:translateY(-1px);border-color:#96c6cf;color:var(--cp-primary);box-shadow:0 5px 14px rgba(28,64,78,.06)}.cp-btn--primary{background:var(--cp-primary);border-color:var(--cp-primary);color:#fff}.cp-btn--primary:hover{background:var(--cp-primary-dark);color:#fff}.cp-btn--soft{background:var(--cp-primary-soft);border-color:#c8e7ec;color:#087d90}.cp-btn--danger{background:#fff;border-color:#eccccc;color:var(--cp-danger)}.cp-btn--sm{min-height:34px;padding:6px 10px;font-size:11px}.cp-btn:disabled{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}
.cp-card,.cp-section{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:14px;box-shadow:0 1px 0 rgba(17,48,59,.02)}.cp-section{margin-bottom:14px;overflow:hidden}.cp-section__head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--cp-line-soft);background:#fbfcfd}.cp-section__title{margin:0;color:var(--cp-ink);font-size:15px}.cp-section__desc{margin:4px 0 0;color:var(--cp-muted);font-size:12px}.cp-section__body{padding:18px}
.cp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:15px}.cp-kpi{padding:15px 16px;border:1px solid var(--cp-line);border-radius:12px;background:#fff}.cp-kpi span{display:block;color:#7b8e97;font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}.cp-kpi strong{display:block;margin-top:5px;color:var(--cp-ink);font-size:22px}.cp-kpi small{display:block;margin-top:4px;color:var(--cp-muted);font-size:11px}
.cp-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:14px;border:1px solid var(--cp-line);border-radius:12px;overflow:hidden;background:var(--cp-line)}.cp-summary__item{padding:13px 15px;background:#fff;min-width:0}.cp-summary__item span{display:block;color:#7b8e97;font-size:10px}.cp-summary__item strong{display:block;margin-top:4px;color:#274754;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#edf3f5;color:#506d78;font-size:10px;font-weight:850;white-space:nowrap}.cp-badge--active{background:var(--cp-primary-soft);color:#08798c}.cp-badge--ok{background:var(--cp-ok-bg);color:var(--cp-ok)}.cp-badge--warn{background:var(--cp-warn-bg);color:var(--cp-warn)}.cp-badge--danger{background:var(--cp-danger-bg);color:var(--cp-danger)}
.cp-filter{display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(160px,1fr)) auto;gap:9px;padding:12px;margin-bottom:14px;border:1px solid var(--cp-line);border-radius:12px;background:#fff}.cp-input{width:100%;min-height:40px;padding:8px 11px;border:1px solid #cbd9de;border-radius:9px;background:#fff;color:#264653;font:inherit;font-size:12px;transition:.15s ease}.cp-input:focus{outline:3px solid rgba(0,143,166,.10);border-color:#50aebe}textarea.cp-input{min-height:84px;resize:vertical}select[multiple].cp-input{min-height:210px;padding:7px}.cp-field{margin-bottom:12px}.cp-field label{display:block;margin-bottom:6px;color:#405f6c;font-size:12px;font-weight:800}.cp-help,.cp-muted{color:var(--cp-muted);font-size:11px;line-height:1.45}.cp-error{margin-top:5px;color:var(--cp-danger);font-size:11px}.cp-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.cp-form-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}.cp-form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--cp-line-soft)}
.cp-table-wrap{overflow:auto}.cp-table{width:100%;border-collapse:collapse;font-size:12px}.cp-table th{padding:11px 12px;border-bottom:1px solid var(--cp-line);background:#f6f9fa;color:#657c86;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.035em;white-space:nowrap}.cp-table td{padding:12px;border-bottom:1px solid var(--cp-line-soft);vertical-align:top;color:#304e5b}.cp-table tbody tr:hover{background:#fbfdfd}.cp-table tr:last-child td{border-bottom:0}.cp-money{white-space:nowrap;font-variant-numeric:tabular-nums}.cp-empty{padding:32px 18px!important;text-align:center;color:#87999f!important}
.cp-board{display:grid;grid-template-columns:repeat(6,minmax(240px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}.cp-column{min-width:240px;padding:8px;border:1px solid var(--cp-line);border-radius:12px;background:#f4f8f9}.cp-column__head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 6px 10px;color:#31515f;font-size:11px;font-weight:850}.cp-count{padding:2px 7px;border-radius:999px;background:#e5eef1;color:#607984;font-size:10px}.cp-process-card{display:block;margin-bottom:8px;padding:12px;border:1px solid #dae5e9;border-radius:10px;background:#fff;color:inherit;text-decoration:none;transition:.16s ease}.cp-process-card:hover{transform:translateY(-1px);border-color:#a9d1d8;box-shadow:var(--cp-shadow)}.cp-process-card__top{display:flex;justify-content:space-between;gap:8px}.cp-process-card__number{font-size:10px;font-weight:850;color:var(--cp-primary)}.cp-process-card__title{margin:6px 0 4px;color:var(--cp-ink);font-size:12px;font-weight:850;line-height:1.35}.cp-process-card__meta{color:var(--cp-muted);font-size:10px;line-height:1.45}.cp-process-card__foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--cp-line-soft);font-size:10px;color:#617a84}

.cp-order{margin-bottom:12px;border:1px solid var(--cp-line);border-radius:13px;background:#fff;overflow:hidden}.cp-order__head{display:grid;grid-template-columns:minmax(230px,1.5fr) minmax(120px,.7fr) minmax(120px,.7fr) minmax(130px,.75fr) minmax(130px,.65fr);gap:14px;align-items:center;padding:15px 17px}.cp-order__number{margin-bottom:4px;color:var(--cp-primary);font-size:10px;font-weight:900;text-transform:uppercase}.cp-order__value{text-align:right;color:var(--cp-ink);font-size:16px;font-weight:900}.cp-order__body{padding:15px;border-top:1px solid var(--cp-line-soft);background:#fbfcfd}.cp-receipt-bar{height:6px;border-radius:999px;background:#e4ecef;overflow:hidden}.cp-receipt-bar span{display:block;height:100%;border-radius:999px;background:var(--cp-primary)}
.cp-disclosure{border:1px solid var(--cp-line);border-radius:10px;background:#fff;overflow:hidden}.cp-disclosure+ .cp-disclosure{margin-top:8px}.cp-disclosure>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;cursor:pointer;list-style:none;color:#3f606d;font-size:11px;font-weight:850}.cp-disclosure>summary::-webkit-details-marker{display:none}.cp-disclosure[open]>summary{border-bottom:1px solid var(--cp-line-soft);background:#fbfcfd}.cp-disclosure__body{padding:12px}.cp-note{padding:11px 12px;border:1px solid #dbe8eb;border-radius:9px;background:#f8fbfc;color:#617982;font-size:11px;line-height:1.5}.cp-note--ok{border-color:#d6e8de;background:var(--cp-ok-bg);color:#416d56}.cp-note--warn{border-color:#ead9b9;background:var(--cp-warn-bg);color:#7f5d29}.cp-note--danger{border-color:#efd2d2;background:var(--cp-danger-bg);color:#8b4646}
@media(max-width:1100px){.cp-page{padding:22px 18px 60px}.cp-filter{grid-template-columns:1fr 1fr}.cp-kpis,.cp-summary{grid-template-columns:repeat(2,1fr)}.cp-order__head{grid-template-columns:1fr 1fr}.cp-order__value{text-align:left}}
@media(max-width:680px){.cp-head{flex-direction:column}.cp-actions{justify-content:flex-start}.cp-filter,.cp-kpis,.cp-summary,.cp-form-grid,.cp-form-grid--3{grid-template-columns:1fr}.cp-page{padding:18px 12px 50px}.cp-title{font-size:24px}}
</style>
