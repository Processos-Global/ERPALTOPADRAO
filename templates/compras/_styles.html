<style>
:root{
  --cp-ink:#173847;--cp-text:#294b5b;--cp-muted:#718692;--cp-line:#d9e5e9;--cp-line-soft:#eaf0f2;

  --cp-shadow:0 10px 30px rgba(28,64,78,.06);
}
.cp-page,.cp-page *{box-sizing:border-box}.cp-page{width:100%;max-width:1600px;margin:0 auto;padding:28px 30px 70px;color:var(--cp-text)}
.cp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.cp-head__copy{min-width:0}.cp-eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:850;color:var(--cp-primary)}.cp-title{margin:4px 0 4px;color:var(--cp-ink);font-size:25px;line-height:1.15}.cp-sub{max-width:850px;color:var(--cp-muted);font-size:12px;line-height:1.55}.cp-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}

.cp-card,.cp-section{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:12px;box-shadow:0 1px 0 rgba(17,48,59,.02)}.cp-section{margin-bottom:12px;overflow:hidden}.cp-section__head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 15px;border-bottom:1px solid var(--cp-line-soft);background:#fbfcfd}.cp-section__title{margin:0;color:var(--cp-ink);font-size:13px}.cp-section__desc{margin:3px 0 0;color:var(--cp-muted);font-size:10px}.cp-section__body{padding:15px}

.cp-filter{display:grid;grid-template-columns:minmax(240px,2fr) repeat(3,minmax(150px,1fr)) auto;gap:8px;padding:10px;margin-bottom:13px;border:1px solid var(--cp-line);border-radius:10px;background:#fff}.cp-input{width:100%;min-height:36px;padding:7px 9px;border:1px solid #ccdce2;border-radius:8px;background:#fff;color:#264653;font:inherit;font-size:11px;transition:.15s ease}.cp-input:focus{outline:3px solid rgba(0,143,166,.10);border-color:#50aebe}textarea.cp-input{min-height:72px;resize:vertical}select[multiple].cp-input{min-height:185px;padding:6px}.cp-field{margin-bottom:10px}.cp-field label{display:block;margin-bottom:5px;color:#405f6c;font-size:10px;font-weight:800}.cp-help,.cp-muted{color:var(--cp-muted);font-size:10px;line-height:1.45}.cp-error{margin-top:4px;color:var(--cp-danger);font-size:10px}.cp-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}.cp-form-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}.cp-form-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--cp-line-soft)}
.cp-table-wrap{overflow:auto}.cp-table{width:100%;border-collapse:collapse;font-size:10.5px}.cp-table th{padding:9px 10px;border-bottom:1px solid var(--cp-line);background:#f5f8f9;color:#657c86;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.035em;white-space:nowrap}.cp-table td{padding:10px;border-bottom:1px solid var(--cp-line-soft);vertical-align:top;color:#304e5b}.cp-table tbody tr:hover{background:#fbfdfd}.cp-table tr:last-child td{border-bottom:0}.cp-money{white-space:nowrap;font-variant-numeric:tabular-nums}.cp-empty{padding:28px 15px!important;text-align:center;color:#87999f!important}

.cp-progress{padding:7px;margin-bottom:12px;border:1px solid var(--cp-line);border-radius:11px;background:#fff}.cp-progress__track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.cp-step{position:relative;padding:9px 10px;border-radius:7px;background:#f6f9fa}.cp-step strong{display:block;color:#627b85;font-size:10px}.cp-step small{display:block;margin-top:2px;color:#94a4aa;font-size:8px}.cp-step.is-current{background:var(--cp-primary-soft)}.cp-step.is-current strong{color:#08798c}.cp-step.is-done{background:var(--cp-ok-bg)}.cp-step.is-done strong{color:var(--cp-ok)}
.cp-next{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;margin-bottom:12px;padding:11px 13px;border:1px solid #cde4e8;border-left:4px solid var(--cp-primary);border-radius:9px;background:#f5fbfc}.cp-next__label{color:var(--cp-primary);font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:850}.cp-next strong{display:block;margin-top:2px;color:#294a57;font-size:12px}.cp-next p{margin:3px 0 0;color:var(--cp-muted);font-size:10px}.cp-next--ok{border-color:#d2e7db;border-left-color:var(--cp-ok);background:#f5faf7}.cp-next--danger{border-color:#eed0d0;border-left-color:var(--cp-danger);background:#fff7f7}
.cp-tabs{display:flex;gap:3px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--cp-line)}.cp-tab{appearance:none;border:0;border-bottom:2px solid transparent;background:transparent;padding:9px 11px;color:#667e87;font:inherit;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}.cp-tab.is-active{border-color:var(--cp-primary);color:var(--cp-primary)}.cp-tab-panel{display:none}.cp-tab-panel.is-active{display:block}.cp-grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:12px}.cp-grid-equal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cp-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.cp-disclosure{margin-bottom:8px;border:1px solid var(--cp-line);border-radius:9px;background:#fff;overflow:hidden}.cp-disclosure summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;cursor:pointer;color:#345563;font-size:10px;font-weight:850;list-style:none}.cp-disclosure summary::-webkit-details-marker{display:none}.cp-disclosure[open] summary{border-bottom:1px solid var(--cp-line-soft);background:#fbfdfd}.cp-disclosure__body{padding:12px}.cp-note{padding:10px 11px;border:1px solid #dae8eb;border-radius:8px;background:#f8fbfc;color:#617982;font-size:10px;line-height:1.55}.cp-note--warn{border-color:#ead9b9;background:var(--cp-warn-bg);color:#7f5d29}.cp-note--ok{border-color:#d6e8de;background:var(--cp-ok-bg);color:#416d56}.cp-note--danger{border-color:#efd2d2;background:var(--cp-danger-bg);color:#8b4646}
.cp-provider-grid{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:9px}.cp-provider{border:1px solid var(--cp-line);border-radius:9px;background:#fff;overflow:hidden}.cp-provider__head{padding:10px 11px;background:#fafcfc;border-bottom:1px solid var(--cp-line-soft)}.cp-provider__name{color:#294a57;font-size:11px;font-weight:850}.cp-provider__meta{margin-top:3px;color:var(--cp-muted);font-size:9px}.cp-provider__body{padding:10px 11px}.cp-list-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--cp-line-soft);font-size:10px}.cp-list-row:last-child{border-bottom:0}
.cp-timeline{display:grid;gap:9px}.cp-event{position:relative;margin-left:4px;padding:0 0 0 12px;border-left:2px solid #c7e1e6}.cp-event:before{content:"";position:absolute;left:-4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--cp-primary)}.cp-event strong{font-size:10px;color:#355663}.cp-event p{margin:3px 0;color:#687f88;font-size:9.5px;line-height:1.45}.cp-event time{font-size:8.5px;color:#91a1a7}
.cp-order{margin-bottom:10px;border:1px solid var(--cp-line);border-radius:10px;background:#fff;overflow:hidden}.cp-order__head{display:grid;grid-template-columns:1.2fr 1.2fr .8fr .8fr auto;gap:12px;align-items:center;padding:11px 13px;background:#fbfcfd;border-bottom:1px solid var(--cp-line-soft)}.cp-order__number{font-size:10px;font-weight:900;color:var(--cp-primary)}.cp-order__value{font-size:12px;font-weight:900;color:var(--cp-ink)}.cp-order__body{padding:12px 13px}.cp-receipt-bar{height:6px;border-radius:999px;background:#e8eff1;overflow:hidden}.cp-receipt-bar>span{display:block;height:100%;background:var(--cp-primary);border-radius:999px}
.cp-item-row{display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(210px,1fr) 115px 110px 36px;gap:8px;align-items:start;padding:10px;border:1px solid var(--cp-line);border-radius:9px;background:#fff}.cp-item-row+.cp-item-row{margin-top:8px}.cp-item-row__remove{width:36px;height:36px;border:1px solid #e3caca;border-radius:8px;background:#fff;color:#a24b4b;cursor:pointer}.cp-item-card-title{font-size:10px;font-weight:850;color:#345462}
.cp-sticky-actions{position:sticky;bottom:12px;z-index:20;display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding:10px;border:1px solid #d4e3e7;border-radius:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(32,62,72,.10)}
@media(max-width:1100px){.cp-kpis,.cp-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.cp-grid-2,.cp-grid-equal{grid-template-columns:1fr}.cp-provider-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cp-filter{grid-template-columns:repeat(2,minmax(0,1fr))}.cp-filter .cp-btn{grid-column:span 2}.cp-item-row{grid-template-columns:1fr 1fr}.cp-item-row__remove{grid-column:2;justify-self:end}.cp-order__head{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.cp-page{padding:18px 14px 55px}.cp-head{flex-direction:column}.cp-actions{justify-content:flex-start}.cp-kpis,.cp-summary,.cp-form-grid,.cp-form-grid--3,.cp-grid-3,.cp-provider-grid,.cp-filter{grid-template-columns:1fr}.cp-filter .cp-btn{grid-column:auto}.cp-progress__track{grid-template-columns:1fr}.cp-next{grid-template-columns:1fr}.cp-item-row{grid-template-columns:1fr}.cp-item-row__remove{grid-column:auto;justify-self:start}.cp-order__head{grid-template-columns:1fr}.cp-sticky-actions{position:static;justify-content:stretch;flex-direction:column}.cp-sticky-actions .cp-btn{width:100%}}
</style>
