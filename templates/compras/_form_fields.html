{% if form.non_field_errors %}{% for error in form.non_field_errors %}<div class="cp-error">{{ error }}</div>{% endfor %}{% endif %}
{% for field in form %}
<div class="cp-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="cp-muted" style="font-size:.66rem;margin-top:3px">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="cp-error">{{ error }}</div>{% endfor %}
</div>
{% endfor %}
