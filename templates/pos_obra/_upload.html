{% if not encerrado and pode_editar %}<form method="post" enctype="multipart/form-data" action="{% url 'pos_obra:upload' chamado.pk %}" class="po-upload" data-form-name="Anexo de {{ etapa }}">{% csrf_token %}<input type="hidden" name="etapa" value="{{ etapa }}"><div class="po-field"><label for="arquivo-{{ etapa }}">{% if etapa == 'FINALIZACAO' %}Via assinada da OS{% else %}Adicionar foto ou documento{% endif %} <span class="po-field-requirement"></span></label><input type="file" id="arquivo-{{ etapa }}" name="arquivo" accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.doc,.docx" aria-describedby="arquivo-{{ etapa }}-ajuda" required>{% if upload_form.data.etapa == etapa %}{{ upload_form.arquivo.errors }}{{ upload_form.non_field_errors }}<p class="po-help">Selecione novamente o arquivo para tentar o envio.</p>{% endif %}</div><div class="po-actions"><label class="po-check"><input type="checkbox" name="publico" {% if upload_form.data.etapa == etapa and upload_form.data.publico %}checked{% endif %}>Disponível para o cliente</label>{% if etapa == 'FINALIZACAO' %}<label class="po-check"><input type="checkbox" name="via_assinada_conferida">Confirmo que este arquivo contém a via física assinada, conferida por mim.</label>{% endif %}<button class="po-button" type="submit">Anexar arquivo</button></div></form>{% endif %}
