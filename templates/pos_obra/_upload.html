{% if not encerrado %}<form method="post" enctype="multipart/form-data" action="{% url 'pos_obra:upload' chamado.pk %}" class="os-file-row">{% csrf_token %}<input type="hidden" name="etapa" value="{{ etapa }}"><div class="po-field"><label for="arquivo-{{ etapa }}">{% if etapa == 'FINALIZACAO' %}Via assinada da OS{% else %}Foto ou documento{% endif %}</label><input type="file" id="arquivo-{{ etapa }}" name="arquivo" accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.doc,.docx" required><span class="po-help">Até 15 MB por arquivo.</span></div><label class="po-check"><input type="checkbox" name="publico">Disponível para o cliente</label><button class="po-button" type="submit">Anexar arquivo</button></form>{% endif %}
