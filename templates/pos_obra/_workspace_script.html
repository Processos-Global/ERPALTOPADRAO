<script>
(function(){const search=document.getElementById('material-live-search'),results=document.getElementById('material-live-results');if(!search||!results)return;const select=document.querySelector('#os-materiais [name=material]'),choice=document.getElementById('material-live-choice');if(!select)return;const options=[...select.options].filter(x=>x.value);
function paint(){let term=search.value.toLocaleLowerCase('pt-BR').trim();results.replaceChildren();if(term.length<2){results.hidden=true;return}let matches=options.filter(x=>x.textContent.toLocaleLowerCase('pt-BR').includes(term)).slice(0,30);matches.forEach(opt=>{let b=document.createElement('button');b.type='button';b.className='po-material-option';b.setAttribute('role','option');b.textContent=opt.textContent;b.addEventListener('click',()=>{select.value=opt.value;search.value=opt.textContent;choice.textContent='Selecionado: '+opt.textContent+' · Informe a quantidade necessária abaixo. Preço de referência aparecerá após adicionar.';select.dispatchEvent(new Event('change',{bubbles:true}));results.hidden=true});results.appendChild(b)});results.setAttribute('role','listbox');if(!matches.length){let em=document.createElement('p');em.textContent='Nenhum material localizado';results.appendChild(em)}results.hidden=false}
search.setAttribute('autocomplete','off');search.setAttribute('aria-controls','material-live-results');search.addEventListener('keydown',e=>{if(e.key==='Escape'){results.hidden=true;return}if(e.key==='ArrowDown'&&!results.hidden){const first=results.querySelector('button');if(first){e.preventDefault();first.focus()}}});results.addEventListener('keydown',e=>{if(e.key==='Escape'){results.hidden=true;search.focus()}});search.addEventListener('input',paint);search.addEventListener('focus',paint);document.addEventListener('click',e=>{if(!search.contains(e.target)&&!results.contains(e.target))results.hidden=true});})();
(function(){document.querySelectorAll('.po-accept-form').forEach(form=>{let canvas=form.querySelector('canvas'),ctx=canvas.getContext('2d'),draw=false,used=false;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#1e293b';const at=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.addEventListener('pointerdown',e=>{draw=true;used=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...at(e))});canvas.addEventListener('pointermove',e=>{if(draw){ctx.lineTo(...at(e));ctx.stroke()}});canvas.addEventListener('pointerup',()=>draw=false);canvas.addEventListener('pointercancel',()=>draw=false);form.querySelector('.po-clear-sign').addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);used=false});form.addEventListener('submit',e=>{let resultado=form.querySelector('[name=resultado]').value;if(resultado!=='RECUSADO'&&!used){e.preventDefault();alert('Colete a assinatura para registrar o aceite.');return}form.querySelector('.po-signature-value').value=used?canvas.toDataURL('image/png'):''})})})();
(()=>{
document.querySelectorAll('[data-po-confirm-stage]').forEach(button=>button.addEventListener('click',event=>{if(!button.form?.checkValidity())return;if(!confirm('Concluir esta etapa? Depois de concluída, a edição exigirá retificação administrativa.'))event.preventDefault();}));
const root=document.querySelector('.po-workbench');if(!root)return;
const tabs=[...root.querySelectorAll('[data-os-tab]')],selector=document.getElementById('po-section-select');
function show(id,focus=false,updateUrl=true){const selected=tabs.find(t=>t.dataset.osTab===id&&!t.disabled);if(!selected)return;
for(const tab of tabs){const active=tab===selected;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;document.getElementById('os-'+tab.dataset.osTab).hidden=!active;}
selector.value=id;root.dataset.activePanel=id;document.querySelectorAll('.po-more-actions').forEach(menu=>menu.open=false);if(updateUrl)history.replaceState(null,'','#'+id);if(focus)selected.focus();}
tabs.forEach(tab=>{tab.addEventListener('click',()=>show(tab.dataset.osTab));tab.addEventListener('keydown',event=>{const available=tabs.filter(t=>!t.disabled&&!t.hidden),i=available.indexOf(tab);let n;if(event.key==='ArrowDown'||event.key==='ArrowRight')n=(i+1)%available.length;if(event.key==='ArrowUp'||event.key==='ArrowLeft')n=(i-1+available.length)%available.length;if(event.key==='Home')n=0;if(event.key==='End')n=available.length-1;if(n!==undefined){event.preventDefault();show(available[n].dataset.osTab,true);}})});
selector.addEventListener('change',()=>show(selector.value));
document.querySelectorAll('[data-po-go]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.poGo);document.getElementById('os-'+b.dataset.poGo)?.focus()}));
const invalid=root.querySelector('.errorlist'),panel=invalid?.closest('.os-panel');
const requested=location.hash.slice(1);const agendaLegacy=requested==='agendamentos';const wanted=panel?panel.id.slice(3):(agendaLegacy||root.dataset.activePanel==='agendamentos'?(document.getElementById('tab-vistoria')?.disabled?'triagem':'vistoria'):requested||root.dataset.activePanel);
show(tabs.some(t=>t.dataset.osTab===wanted&&!t.disabled)?wanted:(tabs.find(t=>t.dataset.stageState==='atual'&&!t.disabled)?.dataset.osTab||'abertura'),false,location.hash!=='#historico');
if(agendaLegacy){document.getElementById(document.getElementById('tab-vistoria')?.disabled?'agenda-triagem-vistoria':'agenda-vistoria')?.scrollIntoView({block:'start'});}
root.querySelectorAll('.po2-schedule').forEach(section=>section.querySelectorAll('form').forEach((form,index)=>form.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{const previous=el.id;el.id=section.id+'-'+index+'-'+previous;const label=el.closest('.po-field')?.querySelector('label');if(label)label.htmlFor=el.id;})));
root.addEventListener('input',event=>{const panel=event.target.closest('.os-panel');if(panel){const dot=document.querySelector('#tab-'+panel.id.slice(3)+' .po-dirty-dot');if(dot)dot.hidden=false}});
})();
</script>
