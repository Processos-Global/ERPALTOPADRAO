<style>

.po-shell{--po-ink:var(--saari-heading);--po-muted:var(--saari-muted);--po-line:var(--saari-line);--po-paper:var(--saari-card);--po-soft:var(--saari-card-soft);--po-action:#453330;max-width:1580px;margin:auto;padding:18px 22px 32px;font:13px/1.55 var(--font-sans);color:var(--saari-text)}
.po-shell *{box-sizing:border-box}.po-shell [hidden]{display:none!important}.po-shell h1{font:400 28px/1.2 var(--font-serif);color:var(--po-ink);margin:4px 0 8px}.po-shell h2{font:700 18px/1.4 var(--font-sans);color:var(--po-ink);margin:0 0 8px}.po-shell h3{font:700 14px/1.4 var(--font-sans);margin:0 0 8px;color:var(--po-ink)}.po-shell h4{font-size:13px;margin:16px 0 8px}.po-shell p{margin:6px 0 12px;overflow-wrap:anywhere}.po-shell a{color:var(--po-ink)}.po-shell small{font-size:11px}.po-shell .po-muted,.po-shell .po-help,.po-shell .os-note{color:var(--po-muted);font-size:12px}.po-shell .po-eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--po-muted);margin:0 0 6px}
