{% if pagina.paginator.count %}<nav class="po-pagination" aria-label="Paginação"><span>{{ pagina.start_index }}–{{ pagina.end_index }} de {{ pagina.paginator.count }} registros · Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span><div class="po-actions">{% if pagina.has_previous %}<a class="po-button" href="?{% if pagina_query %}{{ pagina_query }}&amp;{% endif %}page={{ pagina.previous_page_number }}{{ ancora }}">← Anterior</a>{% endif %}{% if pagina.has_next %}<a class="po-button" href="?{% if pagina_query %}{{ pagina_query }}&amp;{% endif %}page={{ pagina.next_page_number }}{{ ancora }}">Próxima →</a>{% endif %}</div></nav>{% endif %}
