<script>(()=>{const period=document.querySelector('[name=preferencia_periodo]');if(!period)return;const names=['preferencia_inicio','preferencia_fim'];function sync(){names.forEach(name=>{const row=document.querySelector('[data-field='+name+']');if(row){const show=period.value==='HORARIO'||!!row.querySelector('.errorlist');row.hidden=!show;const input=row.querySelector('input');if(input)input.required=period.value==='HORARIO';const label=row.querySelector('.po-field-requirement');if(label)label.textContent=period.value==='HORARIO'?'obrigatório':'opcional';}})}period.addEventListener('change',sync);sync()})();</script>
