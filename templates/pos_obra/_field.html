<div class="po-field {% if f.field.widget.input_type == 'file' or f.name == 'descricao' or f.name == 'comentario' or f.name == 'diagnostico' or f.name == 'execucao' or f.name == 'conclusao' or f.name == 'triagem' or f.name == 'materiais_observacao' or f.name == 'observacoes' %}full{% endif %}" data-field="{{ f.name }}">
<label for="{{ f.id_for_label }}">{{ f.label }} <span class="po-field-requirement">{% if f.field.required or f.name == 'ambiente_padrao' or f.name == 'ambiente_ficha' %}obrigatório{% else %}opcional{% endif %}</span></label>{{ f }}
{% if f.help_text %}<p class="po-help" id="{{ f.auto_id }}_helptext">{{ f.help_text }}</p>{% endif %}{{ f.errors }}</div>
