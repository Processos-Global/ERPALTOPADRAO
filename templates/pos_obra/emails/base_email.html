<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f0e9;color:#503d2d;font-family:'Segoe UI',Arial,sans-serif;">
    <span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;">{{ descricao }}</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f0e9;margin:0;padding:0;width:100%;">
        <tr>
            <td align="center" style="padding:28px 14px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:680px;width:100%;">
                    <tr>
                        <td style="padding:0;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:18px 18px 0 18px;text-align:center;font-size:12px;line-height:1.6;color:#8c7b6b;">
                            <div style="margin-bottom:4px;font-weight:700;color:#503d2d;">SAARI ERP · Pós-Obra</div>
                            <div>Mensagem automática de acompanhamento. Para mais informações, acesse o Portal do Cliente.</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
