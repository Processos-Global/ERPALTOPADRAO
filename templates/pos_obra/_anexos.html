{% for a in arquivos %}<div class="po-row"><div><a href="{% url 'pos_obra:anexo' a.pk %}">{{ a.arquivo.name }}</a><small>{{ a.criado_em|date:'d/m/Y H:i' }} · {% if a.publico %}Disponível ao cliente{% else %}Uso interno{% endif %}</small></div><form method="post" action="{% url 'pos_obra:publicar_anexo' a.pk %}">{% csrf_token %}<input type="hidden" name="publico" value="{% if a.publico %}0{% else %}1{% endif %}"><button class="po-button" type="submit">{% if a.publico %}Tornar interno{% else %}Disponibilizar ao cliente{% endif %}</button></form></div>{% empty %}<p class="po-muted">Nenhum arquivo nesta etapa.</p>{% endfor %}
