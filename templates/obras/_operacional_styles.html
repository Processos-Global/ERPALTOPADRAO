<style>
:root{--op-ink:#2d201c;--op-text:#453330;--op-muted:#77655c;--op-line:#ded7c8;--op-line-soft:#eee8d6;--op-soft:#f5f1e9;--op-gold:#b9aa72;--op-bg:#f7f5f1;--op-danger:#a94343;--op-shadow:0 8px 24px rgba(69,51,48,.055)}
body>.app-shell>.app-content>.page-content{max-width:none!important;margin:0!important;padding:0!important;min-height:100vh!important;background:var(--op-bg)!important}
.op-page,.op-page *{box-sizing:border-box}.op-page{width:100%;max-width:1540px;margin:0 auto;padding:28px 30px 46px;color:var(--op-text);font-family:inherit}
.op-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;margin-bottom:18px;padding:24px 26px 24px 30px;border:1px solid var(--op-line);border-radius:18px;background:linear-gradient(135deg,#fff 0%,#fcfaf6 62%,#f3ecdc 100%);box-shadow:0 14px 38px rgba(69,51,48,.07)}
.op-head::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,var(--op-gold),var(--op-ink))}.op-head::after{content:"";position:absolute;right:-82px;top:-126px;width:220px;height:220px;border-radius:50%;background:rgba(119,101,92,.06)}
.op-head-copy,.op-head-actions{position:relative;z-index:1}.op-eyebrow{display:block;margin-bottom:5px;color:var(--op-gold);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.op-head h1{margin:0;color:var(--op-ink);font-family:var(--font-serif);font-size:clamp(2rem,3vw,3rem);font-weight:400;line-height:1.04;letter-spacing:-.035em}.op-head p{max-width:900px;margin:8px 0 0;color:var(--op-muted);font-size:14px;line-height:1.55}
.op-head-actions,.op-actions{display:flex;gap:8px;flex-wrap:wrap}.op-btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border:1px solid var(--op-ink);border-radius:10px;background:var(--op-ink);color:#fff;text-decoration:none;font:inherit;font-size:13px;font-weight:750;cursor:pointer;transition:.16s ease}.op-btn:hover{background:var(--saari-brown);border-color:var(--saari-brown);color:#fff;transform:translateY(-1px)}.op-btn.secondary{border-color:var(--op-line-soft);background:#fff;color:var(--op-text)}.op-btn.secondary:hover{border-color:#d9d0c2;background:var(--op-soft);color:var(--op-ink)}.op-btn.danger{border-color:#efc0c0;background:#fff;color:var(--op-danger)}
.op-toolbar{display:grid;grid-template-columns:minmax(240px,1fr) minmax(180px,280px) auto;gap:10px;align-items:end;margin-bottom:18px;padding:14px;border:1px solid var(--op-line);border-radius:14px;background:#fff;box-shadow:var(--op-shadow)}.op-toolbar.diario{grid-template-columns:minmax(200px,1fr) 180px 180px auto}.op-field label{display:block;margin:0 0 6px;color:var(--op-text);font-size:12px;font-weight:760}.op-field input,.op-field select,.op-field textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--op-line-soft);border-radius:9px;background:#fff;color:var(--op-text);font:inherit;font-size:13px;outline:none}.op-field textarea{min-height:110px;resize:vertical}.op-field input:focus,.op-field select:focus,.op-field textarea:focus{border-color:var(--op-gold);box-shadow:0 0 0 3px rgba(185,170,114,.12)}
.op-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:18px}.op-summary-card{display:block;padding:17px;border:1px solid var(--op-line);border-radius:14px;background:#fff;color:inherit;text-decoration:none;box-shadow:var(--op-shadow);transition:.16s ease}.op-summary-card:hover{border-color:var(--op-gold);transform:translateY(-2px);color:inherit}.op-summary-card small{display:block;color:var(--op-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.op-summary-card strong{display:block;margin-top:5px;color:var(--op-ink);font-size:16px}.op-summary-card span{display:block;margin-top:7px;color:var(--op-muted);font-size:12px}
.op-panel{overflow:hidden;margin-bottom:18px;border:1px solid var(--op-line);border-radius:15px;background:#fff;box-shadow:var(--op-shadow)}.op-panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 17px;border-bottom:1px solid var(--op-line-soft);background:linear-gradient(180deg,#fff,#fcf9f3)}.op-panel-head h2{margin:0;color:var(--op-ink);font-size:17px}.op-panel-body{padding:17px}.op-table-wrap{width:100%;overflow:auto}.op-table{width:100%;min-width:900px;border-collapse:collapse;font-size:13px}.op-table th{padding:11px 13px;border-bottom:1px solid var(--op-line);background:#fffdfa;color:var(--op-muted);text-align:left;font-size:11px;font-weight:820;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.op-table td{padding:12px 13px;border-bottom:1px solid var(--op-line-soft);vertical-align:middle}.op-table tbody tr:hover{background:#fcfaf6}.op-table tr:last-child td{border-bottom:0}.op-table strong{color:var(--op-ink)}.op-num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}.op-positive{color:#356848;font-weight:800}.op-negative{color:#9e3f3f}.op-muted{color:var(--op-muted);font-size:12px}.op-badge{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:999px;background:var(--op-soft);color:var(--op-text);font-size:11px;font-weight:800;white-space:nowrap}.op-empty{padding:30px!important;text-align:center;color:var(--op-muted)}
.op-form{max-width:980px;margin:0 auto;padding:20px;border:1px solid var(--op-line);border-radius:15px;background:#fff;box-shadow:var(--op-shadow)}.op-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:1/-1}.op-stock-preview{margin:0 0 16px;padding:14px 16px;border:1px solid #e8dfc9;border-radius:12px;background:#fcfaf6}.op-stock-preview strong{color:var(--op-ink)}.op-stock-preview span{color:var(--op-muted)}
.op-diario-card{padding:17px;border-bottom:1px solid var(--op-line-soft)}.op-diario-card:last-child{border-bottom:0}.op-diario-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.op-diario-top h3{margin:0;color:var(--op-ink);font-size:16px}.op-diario-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.op-diario-text{margin:13px 0 0;color:var(--op-text);line-height:1.6;white-space:pre-line}
@media(max-width:900px){.op-page{padding:18px 15px 34px}.op-head{align-items:flex-start;flex-direction:column;padding:21px 19px 21px 23px}.op-head::after{display:none}.op-toolbar,.op-toolbar.diario{grid-template-columns:1fr}.c3,.c4,.c6,.c8{grid-column:1/-1}.op-head-actions{width:100%}.op-head-actions .op-btn{flex:1}}
</style>
<style>
.op-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 18px}.op-kpi-card{padding:17px 18px;border:1px solid var(--op-line);border-radius:14px;background:#fff;box-shadow:var(--op-shadow)}.op-kpi-card small{display:block;color:var(--op-muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.055em}.op-kpi-card strong{display:block;margin-top:6px;color:var(--op-ink);font-family:var(--font-serif);font-size:26px;font-weight:500}.op-kpi-card span{display:block;margin-top:5px;color:var(--op-muted);font-size:12px}.op-kpi-card.emphasis{background:linear-gradient(135deg,#fff 0%,#fbf7ee 100%);border-color:#d8ccb0}.op-summary-value{display:block;margin-top:9px;color:var(--op-ink);font-size:18px;font-variant-numeric:tabular-nums}
.op-modal{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:22px;visibility:hidden;opacity:0;transition:opacity .16s ease,visibility .16s ease}.op-modal.is-open{visibility:visible;opacity:1}.op-modal-backdrop{position:absolute;inset:0;background:rgba(35,27,24,.48);backdrop-filter:blur(2px)}.op-modal-dialog{position:relative;z-index:1;width:min(760px,100%);max-height:calc(100vh - 44px);overflow:auto;border:1px solid var(--op-line);border-radius:18px;background:#fff;box-shadow:0 28px 90px rgba(45,32,28,.25);transform:translateY(8px) scale(.99);transition:transform .16s ease}.op-modal.is-open .op-modal-dialog{transform:none}.op-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px 16px;border-bottom:1px solid var(--op-line-soft);background:linear-gradient(180deg,#fff,#fcf9f3)}.op-modal-head h2{margin:0;color:var(--op-ink);font-size:22px}.op-modal-close{width:36px;height:36px;border:1px solid var(--op-line);border-radius:10px;background:#fff;color:var(--op-text);font-size:25px;line-height:1;cursor:pointer}.op-modal-close:hover{background:var(--op-soft)}.op-modal-body{padding:20px 22px}.op-modal-grid{margin-top:12px}.op-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--op-line-soft)}body.op-modal-open{overflow:hidden}
@media(max-width:700px){.op-modal{padding:10px;align-items:flex-end}.op-modal-dialog{max-height:92vh;border-radius:18px 18px 10px 10px}.op-modal-head,.op-modal-body{padding-left:16px;padding-right:16px}.op-modal-actions .op-btn{flex:1}}
</style>
