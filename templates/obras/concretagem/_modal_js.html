<div class="op-modal" id="cc-confirmar" aria-hidden="true">
  <div class="op-modal-backdrop"></div>
  <div class="op-modal-dialog" role="dialog" aria-modal="true" style="width:min(460px,100%)">
    <div class="op-modal-head"><h2>Confirmar</h2><button class="op-modal-close" type="button" data-cc-close aria-label="Fechar">×</button></div>
    <div class="op-modal-body"><p data-cc-confirm-text style="margin:0"></p>
      <div class="op-modal-actions"><button class="op-btn secondary" type="button" data-cc-close>Voltar</button><button class="op-btn" type="button" data-cc-confirm-ok>Confirmar</button></div>
    </div>
  </div>
</div>
<script>
(function(){
  /* A animação de entrada da página (.page-reveal) deixa um transform no
     conteúdo, o que faz position:fixed valer em relação a ele e não à tela.
     Por isso os pop-ups são levados para fora do conteúdo, direto no body:
     ficam sempre centralizados na tela e por cima de tudo. */
  var host=document.createElement('div');
  host.className='cc-page cc-modais';
  document.body.appendChild(host);
  document.querySelectorAll('.op-modal').forEach(function(m){host.appendChild(m);});
  const shell = document.querySelector('.app-shell');

  let active = null;
  let returnFocus = null;

  function focusable(dialog) {
    return [...dialog.querySelectorAll('a[href], button, input, select, textarea, [tabindex]')]
      .filter(element => element.tabIndex >= 0 && !element.disabled && element.getClientRects().length);
  }

  function fechar(restoreFocus = true) {
    if (!active) return;
    active.classList.remove('is-open');
    active.setAttribute('aria-hidden', 'true');
    active = null;
    document.body.classList.remove('op-modal-open');
    if (shell) shell.inert = false;
    if (restoreFocus && returnFocus?.isConnected) returnFocus.focus({preventScroll: true});
  }

  function abrir(id, trigger = document.activeElement) {
    const modal = document.getElementById(id);
    if (!modal) return;
    if (!active || !active.contains(trigger)) returnFocus = trigger;
    fechar(false);
    if (modal.parentNode !== host) host.appendChild(modal);
    active = modal;
    active.classList.add('is-open');
    active.setAttribute('aria-hidden', 'false');
    document.body.classList.add('op-modal-open');
    if (shell) shell.inert = true;
    const dialog = active.querySelector('.op-modal-dialog');
    if (!dialog) return;
    dialog.scrollTop = 0;
    dialog.tabIndex = -1;
    const heading = dialog.querySelector('.op-modal-head h2');
    if (heading && !dialog.hasAttribute('aria-labelledby')) {
      heading.id ||= id + '-titulo';
      dialog.setAttribute('aria-labelledby', heading.id);
    }
    const initial = dialog.querySelector('[data-cc-close]') || dialog;
    initial.focus({preventScroll: true});
    if (!dialog.contains(document.activeElement)) {
      requestAnimationFrame(() => {
        if (active === modal) initial.focus({preventScroll: true});
      });
    }
  }

  window.ccAbrirModal = abrir;
  window.ccFecharModal = fechar;
  document.addEventListener('click', event => {
    const trigger = event.target.closest('[data-cc-open]');
    if (trigger) {
      event.preventDefault();
      abrir(trigger.dataset.ccOpen, trigger);
      return;
    }
    if (active && (event.target.closest('[data-cc-close]') || event.target.classList.contains('op-modal-backdrop'))) {
      event.preventDefault();
      fechar();
    }
  });
  document.addEventListener('keydown', event => {
    if (!active) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      fechar();
    }
    if (event.key !== 'Tab') return;
    const dialog = active.querySelector('.op-modal-dialog');
    const controls = focusable(dialog);
    const first = controls[0];
    const last = controls.at(-1);
    const current = document.activeElement;
    if (!dialog.contains(current) || (event.shiftKey && (current === first || current === dialog)) || (!event.shiftKey && current === last)) {
      event.preventDefault();
      (event.shiftKey ? last : first)?.focus();
    } else if (!controls.length) {
      event.preventDefault();
    }
  });
  /* Formulários com confirmação: o app.js do ERP marca o botão como "carregando"
     em todo submit, mesmo quando a confirmação cancela. Por isso o botão recebe
     data-no-loading e o estado de carregamento só é aplicado ao confirmar. */
  /* Também usado para conteúdo que chega depois (ex.: busca por AJAX): ccPrepararConfirmacoes(container). */
  function preparar(raiz){(raiz||document).querySelectorAll('form[data-cc-confirm]').forEach(function(f){
    if(f.dataset.ccConfirmPronto)return;f.dataset.ccConfirmPronto='1';
    var botoes=f.querySelectorAll('button[type="submit"],input[type="submit"]');
    botoes.forEach(function(b){b.setAttribute('data-no-loading','');});
    f.addEventListener('submit',function(e){
      if(f.dataset.ok)return;
      e.preventDefault();
      var m=document.getElementById('cc-confirmar');
      m.querySelector('[data-cc-confirm-text]').textContent=f.getAttribute('data-cc-confirm');
      m.querySelector('[data-cc-confirm-ok]').onclick=function(){
        f.dataset.ok=1;fechar();
        botoes.forEach(function(b){b.classList.add('is-submitting');if(b.matches('button'))b.setAttribute('aria-busy','true');});
        f.submit();
      };
      abrir('cc-confirmar', e.submitter || document.activeElement);
    });
  });}
  preparar(document);
  window.ccPrepararConfirmacoes=preparar;
})();
</script>
