<style>
:root{
  --obra-ink:#173746;
  --obra-text:#3d5360;
  --obra-muted:#71858f;
  --obra-line:#d7e6ea;
  --obra-line-soft:#eaf1f3;
  --obra-bg:#f7fafb;
  --obra-card:#ffffff;
  --obra-primary:#1D91A6;
  --obra-primary-dark:#0E5268;
  --obra-primary-deep:#0A4054;
  --obra-primary-soft:#DDF3F6;
  --obra-primary-border:#BDE6EC;
  --obra-ok:#287a50;
  --obra-ok-bg:#edf8f2;
  --obra-danger:#b64646;
  --obra-danger-bg:#fff1f1;
  --obra-shadow:0 8px 24px rgba(28,67,80,.055);
  --obra-shadow-hover:0 14px 34px rgba(28,67,80,.09);
}

body>.app-shell>.app-content>.page-content{
  max-width:none!important;
  margin:0!important;
  padding:0!important;
  min-height:100vh!important;
  background:var(--obra-bg)!important;
}

.ft-page,.ft-list,.ft-page *,.ft-list *{box-sizing:border-box}
.ft-page,.ft-list{
  width:100%;
  max-width:1540px;
  margin:0 auto;
  padding:28px 30px 46px;
  color:var(--obra-text);
  font-family:inherit;
  font-size:15px;
  line-height:1.55;
}

/* Cabeçalho */
.ft-top,.ft-list-head{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  overflow:hidden;
  margin-bottom:18px;
  padding:24px 26px 24px 30px;
  border:1px solid var(--obra-line);
  border-radius:18px;
  background:linear-gradient(135deg,#fff 0%,#fbfefe 62%,#eef9fa 100%);
  box-shadow:0 14px 38px rgba(28,67,80,.07);
}
.ft-top::before,.ft-list-head::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:5px;
  background:linear-gradient(180deg,var(--obra-primary),var(--obra-primary-deep));
}
.ft-top::after,.ft-list-head::after{
  content:"";
  position:absolute;
  right:-82px;
  top:-126px;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(29,145,166,.06);
  pointer-events:none;
}
.ft-head-copy{position:relative;z-index:1;min-width:0}
.ft-eyebrow{
  display:block;
  margin-bottom:5px;
  color:var(--obra-primary);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.ft-top h1,.ft-list-head h1{
  margin:0;
  color:var(--obra-primary-deep);
  font-size:clamp(2rem,3.1vw,3rem);
  font-weight:850;
  line-height:1.04;
  letter-spacing:-.035em;
}
.ft-top small,.ft-list-head p{
  display:block;
  max-width:900px;
  margin:8px 0 0;
  color:var(--obra-muted);
  font-size:14px;
  line-height:1.55;
}
.ft-status{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--obra-primary-border);
  border-radius:999px;
  background:var(--obra-primary-soft);
  color:var(--obra-primary-dark);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

/* Navegação por etapas */
.ft-flow{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0 0 22px;
  padding:6px;
  overflow-x:auto;
  border:1px solid var(--obra-line);
  border-radius:14px;
  background:#fff;
  box-shadow:var(--obra-shadow);
  scrollbar-width:thin;
}
.ft-flow a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 14px;
  border-radius:10px;
  color:#58707c;
  text-decoration:none;
  white-space:nowrap;
  font-size:13px;
  font-weight:750;
  transition:.16s ease;
}
.ft-flow a:hover{background:#f2f8f9;color:var(--obra-primary-dark)}
.ft-flow a.active{
  background:var(--obra-primary-soft);
  color:var(--obra-primary-dark);
  box-shadow:inset 0 0 0 1px var(--obra-primary-border);
}

/* Layout e seções */
.ft-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.ft-side{display:none}
.ft-panel,.ft-form-box,.ft-cat-card,.ft-side-card{
  overflow:hidden;
  border:1px solid var(--obra-line);
  border-radius:15px;
  background:#fff;
  box-shadow:var(--obra-shadow);
}
.ft-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:60px;
  padding:15px 18px;
  border-bottom:1px solid var(--obra-line-soft);
  background:linear-gradient(180deg,#fff,#fbfdfd);
}
.ft-panel-head h2{margin:0;color:var(--obra-primary-deep);font-size:18px;font-weight:820}
.ft-panel-body{padding:18px}
.ft-form-box{padding:18px;margin-bottom:18px;box-shadow:none}
.ft-form-title{margin-bottom:14px;color:var(--obra-primary-deep);font-size:15px;font-weight:820}
.ft-section-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 10px}
.ft-section-bar strong{color:var(--obra-primary-deep);font-size:14px;font-weight:820}
.ft-section-bar span{color:var(--obra-muted);font-size:12px;font-weight:700}

/* Grid de formulário */
.ft-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:end}
.ft-grid.compact{gap:11px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:1/-1}
.ft-field label{
  display:block;
  margin:0 0 6px;
  color:#405965;
  font-size:12px;
  font-weight:760;
}
.ft-field input,.ft-field select,.ft-field textarea,.ft-system-choice select{
  width:100%;
  min-height:42px;
  padding:9px 11px;
  border:1px solid #cfdde2;
  border-radius:9px;
  background:#fff;
  color:#304a57;
  font:inherit;
  font-size:13px;
  outline:none;
  transition:.16s ease;
}
.ft-field textarea{min-height:84px;resize:vertical}
.ft-field input:hover,.ft-field select:hover,.ft-field textarea:hover,.ft-system-choice select:hover{border-color:#aac9d0}
.ft-field input:focus,.ft-field select:focus,.ft-field textarea:focus,.ft-system-choice select:focus{border-color:#65b2c0;box-shadow:0 0 0 3px rgba(29,145,166,.10)}

/* Botões */
.ft-btn,.ft-icon-btn{
  appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:40px;
  padding:8px 14px;
  border:1px solid var(--obra-primary);
  border-radius:10px;
  background:var(--obra-primary);
  color:#fff;
  text-decoration:none;
  font:inherit;
  font-size:13px;
  font-weight:750;
  line-height:1.2;
  cursor:pointer;
  transition:.16s ease;
}
.ft-btn:hover,.ft-icon-btn:hover{border-color:var(--obra-primary-dark);background:var(--obra-primary-dark);color:#fff;box-shadow:0 6px 16px rgba(29,145,166,.10);transform:translateY(-1px)}
.ft-btn.secondary{border-color:#ccdce1;background:#fff;color:#405965}
.ft-btn.secondary:hover{border-color:#8fc7d0;background:#fff;color:var(--obra-primary-dark)}
.ft-btn.danger,.ft-icon-btn.danger{border-color:#efbcbc;background:#fff;color:var(--obra-danger)}
.ft-btn.danger:hover,.ft-icon-btn.danger:hover{border-color:#df9292;background:var(--obra-danger-bg);color:#982f2f}
.ft-icon-btn{min-height:34px;padding:6px 10px;font-size:12px}
.ft-submit-cell{display:flex;align-items:end}.ft-submit-cell .ft-btn{width:100%}

/* Tabelas */
.ft-table-wrap{width:100%;overflow:auto;border:1px solid var(--obra-line);border-radius:13px;background:#fff;scrollbar-width:thin}
.ft-table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:13px}
.ft-table th{
  padding:11px 13px;
  border-bottom:1px solid var(--obra-line);
  background:#f5f9fa;
  color:#5a717c;
  text-align:left;
  font-size:11px;
  font-weight:820;
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
}
.ft-table td{padding:12px 13px;border-bottom:1px solid var(--obra-line-soft);vertical-align:middle;color:#39535f;line-height:1.4}
.ft-table tbody tr{transition:background .12s}.ft-table tbody tr:hover{background:#f8fbfc}.ft-table tr:last-child td{border-bottom:0}
.ft-table td strong{color:#274754;font-weight:790}
.ft-table-items{min-width:820px}.ft-row-note{display:block;margin-top:3px;color:var(--obra-muted);font-size:11px;line-height:1.4}.ft-spec{max-width:380px}.ft-action-cell{width:88px}
.ft-empty{padding:30px 18px!important;text-align:center;color:#8597a0!important;font-size:13px}

/* Badges */
.ft-badge,.ft-sync,.ft-chip,.ft-tab-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  font-weight:800;
}
.ft-badge{padding:5px 8px;border-radius:999px;background:var(--obra-primary-soft);color:var(--obra-primary-dark);font-size:11px}
.ft-sync{padding:5px 8px;border-radius:999px;background:#eef8fb;color:#33738f;font-size:10px}
.ft-sync.is-linked{background:var(--obra-ok-bg);color:var(--obra-ok)}
.ft-chip{min-width:28px;height:28px;padding:0 8px;border:1px solid var(--obra-primary-border);border-radius:999px;background:var(--obra-primary-soft);color:var(--obra-primary-dark);font-size:11px}

/* Abas de ambientes */
.ft-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.ft-tabs a{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 10px;
  border:1px solid var(--obra-line);
  border-radius:10px;
  background:#fff;
  color:#56707b;
  text-decoration:none;
  font-size:12px;
  font-weight:750;
  transition:.15s ease;
}
.ft-tabs a:hover{border-color:#b7dce2;background:#f7fbfc;color:var(--obra-primary-dark)}
.ft-tabs a.active{border-color:var(--obra-primary-border);background:var(--obra-primary-soft);color:var(--obra-primary-dark)}
.ft-tabs a.is-filled{border-color:#c8e4d2;background:#fbfefc}
.ft-tabs a.is-filled.active{border-color:var(--obra-primary-border);background:var(--obra-primary-soft)}
.ft-tab-status{gap:4px;padding:3px 7px;border-radius:999px;background:var(--obra-ok-bg);color:var(--obra-ok);font-size:10px}
.ft-context{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:11px 13px;border:1px solid var(--obra-line);border-radius:11px;background:#f7fafb}
.ft-context span{color:#536c76;font-size:12px}.ft-context strong{color:var(--obra-primary-deep)}

/* Categorias */
.ft-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ft-cat-wrap{overflow:hidden;border:1px solid var(--obra-line);border-radius:11px;background:#fff;transition:.15s ease}
.ft-cat-wrap:hover,.ft-cat:hover{border-color:#b7dce2;background:#fbfefe}
.ft-cat{display:flex;align-items:flex-start;gap:10px;padding:12px;cursor:pointer;border:1px solid transparent;border-radius:10px}
.ft-cat input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--obra-primary);flex:0 0 auto}
.ft-cat strong{display:block;color:#284b5b;font-size:13px;font-weight:780}.ft-cat small{display:block;margin-top:3px;color:var(--obra-muted);font-size:11px}
.ft-system-choice{padding:0 12px 12px 39px}.ft-system-choice label{display:block;margin-bottom:6px;color:#506873;font-size:11px;font-weight:800}

/* Cards de itens */
.ft-cat-card{margin-bottom:14px;box-shadow:none}
.ft-cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid var(--obra-line-soft);background:linear-gradient(180deg,#fff,#fbfdfd)}
.ft-cat-head strong{color:var(--obra-primary-deep);font-size:14px;font-weight:820}.ft-cat-head small{display:block;margin-top:3px;color:var(--obra-muted);font-size:11px}
.ft-add{border-top:1px solid var(--obra-line-soft);padding:0 15px 15px}.ft-add summary{cursor:pointer;padding:13px 0 10px;color:#315666;font-size:12px;font-weight:800}.ft-add[open] summary{color:var(--obra-primary-dark)}

/* Resumo */
.ft-review-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:4px}
.ft-review-card{position:relative;overflow:hidden;padding:18px;border:1px solid var(--obra-line);border-radius:15px;background:#fff;box-shadow:var(--obra-shadow)}
.ft-review-card::after{content:"";position:absolute;right:-35px;top:-48px;width:105px;height:105px;border-radius:50%;background:rgba(29,145,166,.045)}
.ft-review-card span{display:block;color:var(--obra-muted);font-size:12px;font-weight:720}.ft-review-card strong{position:relative;z-index:1;display:block;margin-top:5px;color:var(--obra-primary-deep);font-size:26px;font-weight:850;letter-spacing:-.03em}

/* Lista de obras */
.ft-list .ft-table-wrap{box-shadow:var(--obra-shadow)}
.ft-name strong{display:block;color:#274754;font-size:13px;font-weight:790}.ft-name small{display:block;margin-top:3px;color:var(--obra-muted);font-size:11px}

/* Mensagens */
.ft-message{margin-bottom:12px;padding:11px 13px;border:1px solid var(--obra-line);border-radius:10px;background:#fff;color:#45616d;font-size:12px;box-shadow:var(--obra-shadow)}

@media(max-width:1050px){.ft-cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .ft-page,.ft-list{padding:22px 16px 34px}
  .ft-top,.ft-list-head{align-items:flex-start;flex-direction:column;gap:14px;padding:22px 22px 22px 26px}
  .ft-top::after,.ft-list-head::after{display:none}
  .ft-review-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .ft-page,.ft-list{padding:16px 10px 28px}
  .ft-top h1,.ft-list-head h1{font-size:2rem}
  .ft-panel-body,.ft-form-box{padding:15px}
  .ft-grid>[class^="c"],.ft-grid>.c2,.ft-grid>.c3,.ft-grid>.c4,.ft-grid>.c5,.ft-grid>.c6,.ft-grid>.c8,.ft-grid>.c9{grid-column:1/-1}
  .ft-cats,.ft-review-grid{grid-template-columns:1fr}
  .ft-table{min-width:700px}
}
</style>
<style>
.ft-panel.ft-panel-loading {
  position: relative;
  pointer-events: none;
}
.ft-panel.ft-panel-loading::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, .36);
  z-index: 20;
}
</style>
